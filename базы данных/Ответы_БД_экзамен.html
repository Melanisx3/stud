GRANT placeorders TO tjefferson;      -- пользователь получает роль
GRANT placeorders TO manager;         -- роль можно вложить в другую

CREATE ROLE clerk LOGIN PASSWORD 'secret';   -- в PostgreSQL роль = пользователь с LOGIN
DROP ROLE placeorders;</code></pre>
<h4>SET ROLE (Oracle, лекции)</h4>
<p>Команда SET ROLE разрешает или запрещает роли в текущем сеансе:</p>
<pre><code>SET ROLE orderentry;
SET ROLE orderentry IDENTIFIED BY y1Ower;   -- роль защищена паролем
SET ROLE ALL;
SET ROLE ALL EXCEPT orderentry;
SET ROLE NONE;                               -- запретить все роли</code></pre>
<p>В PostgreSQL: <code>SET ROLE имя;</code> / <code>RESET ROLE;</code>.</p>
`);

add(69,'Команды DСL. Команда REVOKE. Формальное описание. Примеры',`
<p>Команда <b>REVOKE</b> отменяет ранее предоставленные пользователю или роли полномочия или роль.</p>
<h4>Формальное описание</h4>
<pre><code>REVOKE [ GRANT OPTION FOR ]
  { привилегия [, ...] | ALL [PRIVILEGES] }
  ON объект
  FROM { пользователь | роль | PUBLIC } [, ...]
  [ CASCADE | RESTRICT ];

REVOKE роль FROM пользователь;</code></pre>
<p>В отличие от GRANT используется предложение <code>FROM</code> (у кого отнимаем). <code>CASCADE</code> также отзывает права, переданные дальше.</p>
<h4>Примеры (из лекций)</h4>
<pre><code>REVOKE CREATE TABLE FROM alincoln;
REVOKE placeorders FROM orderentry;
REVOKE SELECT ON customer FROM tjefferson;
REVOKE ALL ON customer FROM mixon;       -- ключевое слово ALL отменяет все объектные полномочия
REVOKE INSERT ON orders FROM PUBLIC;</code></pre>
<p>Нельзя отозвать привилегию, которую пользователь получил из другого источника, или у владельца объекта.</p>
`);

add(70,'Агрегатные функции SQL. Примеры',`
<p>Агрегатные функции обрабатывают набор строк и возвращают <b>одно</b> значение. Используются в списке SELECT и HAVING, с GROUP BY — для каждой группы.</p>
<table>
<tr><th>Функция</th><th>Результат</th></tr>
<tr><td><code>COUNT(*)</code></td><td>число строк (включая NULL)</td></tr>
<tr><td><code>COUNT(столбец)</code></td><td>число значений, не равных NULL</td></tr>
<tr><td><code>COUNT(DISTINCT столбец)</code></td><td>число различных значений</td></tr>
<tr><td><code>SUM(выражение)</code></td><td>сумма</td></tr>
<tr><td><code>AVG(выражение)</code></td><td>среднее арифметическое</td></tr>
<tr><td><code>MIN / MAX</code></td><td>минимум / максимум</td></tr>
<tr><td><code>STRING_AGG, ARRAY_AGG, BOOL_AND</code></td><td>агрегирование в строку, массив, логическая сводка (PostgreSQL)</td></tr>
</table>
<pre><code>SELECT COUNT(*) FROM customer;                           -- общее число покупателей
SELECT SUM(quantity * unitprice) FROM item, stock
WHERE orderid = 32 AND item.stockid = stock.id;          -- сумма заказа
SELECT AVG(studentship), MIN(studentship), MAX(studentship) FROM student;
SELECT state, COUNT(DISTINCT city) FROM customer GROUP BY state;</code></pre>
<p>Все агрегаты (кроме <code>COUNT(*)</code>) игнорируют NULL; для пустого набора SUM/AVG/MIN/MAX дают NULL, COUNT — 0.</p>
`);
add(71,'Скалярные функции SQL. Примеры',`
<p>Скалярные функции принимают значения из одной строки и возвращают одно значение для каждой строки. Они выполняются на сервере, что сокращает сетевой трафик между клиентом и сервером и повышает производительность.</p>
<table>
<tr><th>Группа</th><th>Функции (PostgreSQL)</th></tr>
<tr><td>Числовые</td><td>ABS, ROUND, TRUNC, CEIL, FLOOR, SQRT, POWER, MOD, SIGN</td></tr>
<tr><td>Строковые</td><td>UPPER, LOWER, INITCAP, LENGTH, SUBSTR/SUBSTRING, TRIM, LPAD, RPAD, REPLACE, POSITION, CONCAT</td></tr>
<tr><td>Дата и время</td><td>NOW, CURRENT_DATE, AGE, EXTRACT, DATE_TRUNC</td></tr>
<tr><td>Преобразование</td><td>CAST, TO_CHAR, TO_DATE, TO_NUMBER</td></tr>
<tr><td>Работа с NULL</td><td>COALESCE (в Oracle NVL), NULLIF, GREATEST, LEAST</td></tr>
<tr><td>Условные</td><td>CASE WHEN … THEN … ELSE … END</td></tr>
</table>
<pre><code>SELECT SQRT(120);                                     -- 10.954...
SELECT lastname, COALESCE(address, 'NONE AVAILABLE') AS address FROM customer;
INSERT INTO orders (id, customerid, orderdate) VALUES (34, 534, CURRENT_DATE);
SELECT UPPER(fam), LENGTH(fam), SUBSTR(name, 1, 1) FROM student;
SELECT id, CASE WHEN onhand &lt; reorder THEN 'Заказать' ELSE 'Достаточно' END FROM stock;</code></pre>
<p>В Oracle для вызова функций без таблицы используют фиктивную таблицу <code>DUAL</code> (<code>SELECT SQRT(120) FROM dual</code>); в PostgreSQL FROM не нужен.</p>
`);

add(72,'Функции преобразования типов в SQL. Примеры',`
<p>Преобразование бывает <b>неявным</b> (СУБД сама приводит типы, например число к строке в конкатенации) и <b>явным</b>.</p>
<table>
<tr><th>Функция</th><th>Назначение</th></tr>
<tr><td><code>CAST(выражение AS тип)</code></td><td>стандартное явное преобразование</td></tr>
<tr><td><code>выражение::тип</code></td><td>сокращённая форма PostgreSQL</td></tr>
<tr><td><code>TO_CHAR(значение, формат)</code></td><td>число/дата → строка</td></tr>
<tr><td><code>TO_NUMBER(строка, формат)</code></td><td>строка → число</td></tr>
<tr><td><code>TO_DATE(строка, формат)</code>, <code>TO_TIMESTAMP</code></td><td>строка → дата</td></tr>
</table>
<pre><code>SELECT CAST('123' AS INTEGER) + 1;            -- 124
SELECT '2026-11-25'::date;
SELECT TO_CHAR(CURRENT_DATE, 'DD.MM.YYYY');   -- 25.11.2026
SELECT TO_CHAR(12345.6, 'FM999G999D00');
SELECT TO_DATE('06-JUN-93', 'DD-MON-YY');
SELECT TO_NUMBER('1 234,50', 'FM9G999D99');
SELECT 'Заказ №' || id::text FROM orders;
SELECT * FROM orders WHERE orderdate &lt; TO_DATE('31-05-1993','DD-MM-YYYY');</code></pre>
<p>Если строку невозможно преобразовать (<code>'abc'::int</code>), возникает ошибка — в PL/pgSQL её можно перехватить блоком EXCEPTION.</p>
`);

add(73,'Процедурные расширения SQL. Структура модулей PL/pgSQL',`
<p>SQL — непроцедурный язык: мы сообщаем серверу <i>что</i> сделать, а не <i>как</i>. Процедурные языки (Си, Ада, Паскаль) требуют знания способа доступа к данным и структурированных программ, но гибче и мощнее. Чтобы объединить достоинства, PostgreSQL предлагает процедурное расширение SQL — <b>PL/pgSQL</b> (в Oracle — PL/SQL).</p>
<p>Преимущества: вместо отдельных операторов SQL клиент вызывает компилированные программы на сервере; резко сокращается сетевой трафик; логика хранится вместе с данными.</p>
<h4>Блочная структура</h4>
<pre><code>[ &lt;&lt;метка&gt;&gt; ]
[ DECLARE
    объявления переменных, констант, курсоров, типов ]
BEGIN
    операторы PL/pgSQL;
    [ BEGIN  -- вложенный блок
        операторы;
      END; ]
[ EXCEPTION
    WHEN условие THEN обработка ]
END [ метка ];</code></pre>
<ul>
<li>каждое объявление и оператор завершаются <code>;</code>; вложенный блок — тоже <code>END;</code>, финальный END тела функции без «;» не обязателен;</li>
<li>ключевые слова не чувствительны к регистру; идентификаторы приводятся к нижнему регистру, если не в двойных кавычках;</li>
<li>комментарии: <code>--</code> до конца строки, <code>/* ... */</code> (могут быть вложенными);</li>
<li>тело функции заключают в долларовые кавычки <code>$$</code> — одинарные кавычки внутри экранировать не нужно.</li>
</ul>
<pre><code>CREATE FUNCTION func1() RETURNS integer AS $$
DECLARE
  quantity integer := 30;
BEGIN
  RAISE NOTICE 'quantity = %', quantity;               -- 30
  quantity := 50;
  DECLARE                                              -- вложенный блок
    quantity integer := 80;
  BEGIN
    RAISE NOTICE 'во вложенном = %', quantity;         -- 80
  END;
  RAISE NOTICE 'снова во внешнем = %', quantity;       -- 50
  RETURN quantity;
END;
$$ LANGUAGE plpgsql;</code></pre>
<p>Переменные вложенного блока скрывают внешние с тем же именем; доступ к внешним — через метку блока (<code>метка.имя</code>). Анонимный блок: <code>DO $$ ... $$;</code>. Метки нужны только для <code>EXIT</code> и для уточнения имён.</p>
`);

add(74,'Типы данных, определяемые пользователем RECORD и ARRAY. Примеры',`
<h4>RECORD</h4>
<p>Строго говоря, RECORD — не настоящий тип, а <b>псевдотип</b>. Переменная RECORD содержит строку результата SELECT; её структура не фиксирована и определяется атрибутами полученной строки.</p>
<pre><code>DO $$
DECLARE
  rec RECORD;
BEGIN
  SELECT id, customerid, orderdate INTO rec
  FROM orders WHERE customerid = 137 LIMIT 1;
  RAISE NOTICE '% % %', rec.id, rec.customerid, rec.orderdate;
END;
$$ LANGUAGE plpgsql;</code></pre>
<h4>ARRAY</h4>
<p>Одномерные и многомерные массивы:</p>
<pre><code>DECLARE
  ordernumber NUMERIC(5,0) ARRAY;          -- по стандарту SQL
  marks INTEGER[] := ARRAY[5, 4, 3];       -- синтаксис PostgreSQL
BEGIN
  marks[1] := 2;
  RAISE NOTICE 'Элементов: %', array_length(marks, 1);</code></pre>
<h4>%TYPE и %ROWTYPE</h4>
<ul>
<li><code>имя Customer.FirstName%TYPE</code> — тип столбца таблицы или переменной. При изменении типа в БД программу переписывать не нужно. Полезно в полиморфных функциях.</li>
<li><code>CusRow Customer%ROWTYPE</code> — переменная-кортеж с типом строки таблицы или представления.</li>
</ul>
<pre><code>DECLARE
  cus_name  customer.firstname%TYPE;
  cus_row   customer%ROWTYPE;
BEGIN
  SELECT * INTO cus_row FROM customer WHERE id = 1;
  cus_name := cus_row.firstname;</code></pre>
<p>В Oracle (лекции) есть также типы <code>TYPE ... IS RECORD</code> и <code>TABLE</code> (аналог ассоциативного массива).</p>
`);

add(75,'Предложение INTO для присваивания переменным модуля значений БД',`
<p>Чтобы программа PL/pgSQL могла работать с информацией самой БД, значения из результата запроса присваивают переменным. Способ зависит от числа возвращаемых строк: <b>SELECT … INTO</b> для одной строки, <b>курсор</b> — для нескольких.</p>
<pre><code>DECLARE
  current_order orders%ROWTYPE;
  n_name varchar;
BEGIN
  SELECT id, customerid, orderdate
    INTO current_order.id, current_order.customerid, current_order.orderdate
  FROM orders WHERE id = 453;

  SELECT lastname INTO n_name FROM customer WHERE id = 7;
END;</code></pre>
<ul>
<li>Предложение INTO применимо только когда запрос возвращает <b>ровно одну строку</b>.</li>
<li>Если строк нет — переменные получают NULL (с опцией <code>INTO STRICT</code> возникает исключение <code>NO_DATA_FOUND</code>).</li>
<li>Если строк несколько — берётся первая; с <code>STRICT</code> — исключение <code>TOO_MANY_ROWS</code>.</li>
<li>Проверить результат можно через специальную переменную <code>FOUND</code>.</li>
</ul>
<pre><code>SELECT id INTO STRICT cid FROM customer WHERE lastname = 'Иванов';</code></pre>
<p>Для нескольких строк используют курсоры или цикл <code>FOR rec IN SELECT ... LOOP</code> (вопросы 76, 78).</p>
`);

add(76,'Курсоры. Примеры',`
<p><b>Курсор</b> — объект БД, по существу имя многострочного запроса; позволяет обработать строки результата по одной. Строки возвращаются в том порядке, в котором их выдаёт запрос.</p>
<h4>Объявление</h4>
<pre><code>имя [ [NO] SCROLL ] CURSOR [ (параметр тип, ...) ] FOR запрос;</code></pre>
<p>SCROLL — разрешена прокрутка назад; параметры — «курсор с параметрами».</p>
<h4>Работа с курсором: OPEN → FETCH (в цикле) → CLOSE</h4>
<pre><code>OPEN order_cursor(3);
FETCH NEXT FROM order_cursor INTO current_order;
CLOSE order_cursor;</code></pre>
<p>Синтаксис FETCH: <code>FETCH [направление] [количество] { IN | FROM } курсор [INTO ...]</code>. Направления: FORWARD (по умолчанию), BACKWARD, RELATIVE. Количество: число, ALL, NEXT, PRIOR. После выборки доступна переменная <code>FOUND</code> (в Oracle — атрибуты <code>%FOUND</code>, <code>%NOTFOUND</code>, <code>%ROWCOUNT</code>, <code>%ISOPEN</code>).</p>
<h4>Пример: общая сумма позиций заказа (исправленный вариант лекции)</h4>
<pre><code>CREATE OR REPLACE FUNCTION item_total(ordernumber NUMERIC)
RETURNS NUMERIC AS $$
DECLARE
  order_cursor CURSOR (num NUMERIC) FOR
      SELECT total FROM item WHERE orderid = num;
  order_total NUMERIC(8,2) := 0;
  line_total  NUMERIC(8,2);
BEGIN
  OPEN order_cursor(ordernumber);
  LOOP
    FETCH NEXT FROM order_cursor INTO line_total;
    EXIT WHEN NOT FOUND;                 -- выход после последней строки
    order_total := order_total + line_total;
  END LOOP;
  CLOSE order_cursor;
  RETURN order_total;
END;
$$ LANGUAGE plpgsql;</code></pre>
<p>Упрощённая форма — цикл <code>FOR</code> по запросу: <code>FOR r IN SELECT total FROM item WHERE orderid = n LOOP ... END LOOP;</code> — курсор открывается и закрывается автоматически.</p>
`);

add(77,'Операторы управления PL/pgSQL. Условные операторы. Примеры',`
<p>Операторы управления позволяют реализовать нелинейные (разветвляющиеся и циклические) алгоритмы обработки данных БД. Условные операторы — <b>IF</b> и <b>CASE</b>; они образуют три формы ветвления.</p>
<h4>1. IF … THEN</h4>
<pre><code>IF условие THEN операторы
[ ELSIF условие THEN операторы ]
[ ELSE операторы ]
END IF;</code></pre>
<p>Условие срабатывает только при TRUE (при FALSE или NULL — нет). Если ELSE нет и ни одно условие не истинно, управление переходит к следующему оператору.</p>
<pre><code>IF onhand = 0 THEN
  RAISE NOTICE 'Нет на складе';
ELSIF onhand &lt; reorder THEN
  RAISE NOTICE 'Пора заказывать';
ELSE
  RAISE NOTICE 'Достаточно';
END IF;</code></pre>
<h4>2. CASE по условию (searched)</h4>
<pre><code>CASE
  WHEN mark &gt;= 5 THEN grade := 'отлично';
  WHEN mark = 4  THEN grade := 'хорошо';
  ELSE grade := 'удовлетворительно';
END CASE;</code></pre>
<h4>3. CASE по значению выражения (simple)</h4>
<pre><code>CASE status
  WHEN 'F' THEN RAISE NOTICE 'Оплачено';
  WHEN 'B', 'D' THEN RAISE NOTICE 'Долг';    -- можно несколько значений
END CASE;</code></pre>
<p>Отличия от SQL-выражения CASE: оператор завершается <code>END CASE</code>, допускает несколько значений в WHEN. Если ни одно условие не выполнено и нет ELSE — возникает ошибка (<code>CASE_NOT_FOUND</code>), в отличие от IF.</p>
`);

add(78,'Операторы управления PL/pgSQL. Операторы цикла. Примеры',`
<h4>1. FOR по диапазону чисел</h4>
<pre><code>&lt;&lt;метка&gt;&gt;
FOR i IN [REVERSE] выражение1 .. выражение2 [BY шаг] LOOP
  операторы;
END LOOP;</code></pre>
<p>Счётчик объявлять не нужно. Шаг по умолчанию 1; при REVERSE счётчик убывает (границы пишутся от большей к меньшей).</p>
<pre><code>FOR i IN 1..5 LOOP RAISE NOTICE 'i = %', i; END LOOP;
FOR i IN REVERSE 10..1 BY 3 LOOP ... END LOOP;   -- 10, 7, 4, 1</code></pre>
<h4>2. WHILE</h4>
<pre><code>WHILE условие LOOP
  операторы;
END LOOP;</code></pre>
<p>Тело выполняется, пока условие истинно (проверка до итерации).</p>
<h4>3. Безусловный LOOP</h4>
<pre><code>LOOP
  операторы;
  EXIT [метка] [WHEN условие];       -- выход
  CONTINUE [метка] [WHEN условие];   -- следующая итерация
END LOOP;</code></pre>
<p>EXIT и CONTINUE можно использовать в любых видах циклов; метка полезна во вложенных циклах.</p>
<h4>4. FOR по результату запроса</h4>
<pre><code>FOR r IN SELECT id, lastname FROM customer LOOP
  RAISE NOTICE '% %', r.id, r.lastname;
END LOOP;</code></pre>
<h4>Пример с метками</h4>
<pre><code>&lt;&lt;outer&gt;&gt;
FOR i IN 1..3 LOOP
  FOR j IN 1..3 LOOP
    CONTINUE outer WHEN j = 2;
    EXIT outer WHEN i = 3;
    RAISE NOTICE '% %', i, j;
  END LOOP;
END LOOP;</code></pre>
`);

add(79,'Обработка исключительных ситуаций в PL/pgSQL',`
<p>При работе с данными возможны ошибки (дубликат ключа, деление на ноль, отсутствие данных). PL/pgSQL имеет механизм <b>исключительных ситуаций (ИС)</b>, позволяющий перехватить и обработать ошибку, отделив её от обычной обработки. Обработчики описываются в блоке <code>EXCEPTION</code>. При возникновении ошибки текущий блок прекращается, а его изменения (как во вложенной транзакции) откатываются.</p>
<pre><code>BEGIN
  операторы;
EXCEPTION
  WHEN имя_условия [OR имя_условия ...] THEN операторы
  WHEN OTHERS THEN операторы
END;</code></pre>
<h4>Встроенные ИС (примеры)</h4>
<table>
<tr><th>Условие</th><th>Когда возникает</th></tr>
<tr><td><code>no_data_found</code></td><td>SELECT INTO STRICT без строк</td></tr>
<tr><td><code>too_many_rows</code></td><td>SELECT INTO STRICT вернул больше одной строки</td></tr>
<tr><td><code>unique_violation</code> (23505)</td><td>дубликат в столбце с уникальными значениями (в Oracle DUP_VAL_ON_INDEX)</td></tr>
<tr><td><code>foreign_key_violation</code> (23503)</td><td>нарушение внешнего ключа</td></tr>
<tr><td><code>division_by_zero</code> (22012)</td><td>деление на 0 (ZERO_DIVIDE)</td></tr>
<tr><td><code>invalid_cursor_state</code>, <code>duplicate_cursor</code></td><td>ошибки курсоров</td></tr>
<tr><td><code>OTHERS</code></td><td>любая другая ошибка</td></tr>
</table>
<h4>Пример</h4>
<pre><code>CREATE FUNCTION customer_id(last varchar, first varchar) RETURNS integer AS $$
DECLARE cid integer;
BEGIN
  SELECT id INTO STRICT cid FROM customer
  WHERE lastname = last AND firstname = first;
  RETURN cid;
EXCEPTION
  WHEN no_data_found THEN
    RAISE NOTICE 'Покупатель с такими именем и фамилией не существует';
    RETURN NULL;
  WHEN too_many_rows THEN
    RAISE NOTICE 'Покупателей с такими именем и фамилией несколько';
    RETURN NULL;
  WHEN OTHERS THEN
    RAISE NOTICE 'Код ошибки: %, сообщение: %', SQLSTATE, SQLERRM;
    RETURN NULL;
END;
$$ LANGUAGE plpgsql;</code></pre>
<p>Доступны переменные <code>SQLSTATE</code> (код ошибки) и <code>SQLERRM</code> (текст). Пользовательские ошибки вызывают командой RAISE (вопрос 80).</p>
`);

add(80,'Команда Raise. Примеры',`
<p><b>RAISE</b> выводит сообщения и вызывает ошибки.</p>
<h4>Формы</h4>
<pre><code>RAISE [уровень] 'формат' [, выражение [, ...]] [USING параметр = значение [, ...]];
RAISE [уровень] имя_условия [USING параметр = выражение [, ...]];
RAISE [уровень] SQLSTATE 'sqlstate' [USING ...];
RAISE [уровень] USING параметр = выражение [, ...];
RAISE;       -- только в EXCEPTION: повторно вызвать пойманную ошибку</code></pre>
<h4>Уровни</h4>
<p><code>DEBUG, LOG, INFO, NOTICE, WARNING, EXCEPTION</code> (по умолчанию). EXCEPTION вызывает ошибку и обычно прерывает транзакцию, остальные только выдают сообщения; куда они попадут (клиенту или в журнал сервера) зависит от <code>client_min_messages</code> и <code>log_min_messages</code>.</p>
<h4>Формат</h4>
<p>Строка формата — константа; <code>%</code> заменяется значением очередного аргумента, <code>%%</code> — буквальный символ %. Число аргументов должно совпадать с числом %.</p>
<h4>USING-параметры</h4>
<p>MESSAGE, DETAIL, HINT, ERRCODE, COLUMN, CONSTRAINT, DATATYPE, TABLE, SCHEMA.</p>
<pre><code>RAISE NOTICE 'Вызов функции CustomerId (%)', customer_id;

RAISE EXCEPTION 'Несуществующий ID --> %', user_id
  USING HINT = 'Проверьте ваш пользовательский ID';

RAISE 'Duplicate user ID: %', user_id USING ERRCODE = 'unique_violation';
RAISE 'Duplicate user ID: %', user_id USING ERRCODE = '23505';   -- эквивалентно

RAISE division_by_zero;
RAISE SQLSTATE '22012';
RAISE unique_violation USING MESSAGE = 'ID пользователя уже существует: ' || user_id;</code></pre>
`);

add(81,'Триггеры базы данных. Создание объекта БД «триггер». Примеры',`
<p><b>Триггер</b> — процедура (функция) PL/pgSQL, связанная с целевой таблицей. Когда для таблицы выполняется DML-оператор и выполнены условия запуска, СУБД <i>автоматически</i> запускает тело триггера. Триггеры позволяют задать сложные правила поддержания целостности данных — ещё одно средство SQL для этого.</p>
<h4>Команда CREATE TRIGGER</h4>
<pre><code>CREATE [ OR REPLACE ] TRIGGER имя_триггера
  { BEFORE | AFTER | INSTEAD OF }
  { INSERT | UPDATE [OF столбцы] | DELETE | TRUNCATE } [ OR ... ]
  ON имя_таблицы
  [ FOR EACH ROW | FOR EACH STATEMENT ]
  [ WHEN (условие) ]
  EXECUTE { FUNCTION | PROCEDURE } имя_функции(аргументы);</code></pre>
<h4>Пример: вычисление суммы позиции заказа</h4>
<pre><code>CREATE FUNCTION line_total() RETURNS TRIGGER AS $$
DECLARE
  item_price REAL;
BEGIN
  SELECT unitprice INTO item_price FROM stock WHERE id = NEW.stockid;
  NEW.total := NEW.quantity * item_price;
  RETURN NEW;
END;
$$ LANGUAGE plpgsql;

CREATE TRIGGER line_total
  BEFORE INSERT OR UPDATE ON item
  FOR EACH ROW
  EXECUTE FUNCTION line_total();</code></pre>
<p>Удалить: <code>DROP TRIGGER line_total ON item;</code>. Отключить: <code>ALTER TABLE item DISABLE TRIGGER line_total;</code>.</p>
`);

add(82,'Триггеры базы данных. Типы триггеров',`
<h4>По времени выполнения относительно события</h4>
<ul>
<li><b>BEFORE</b> — срабатывает до DML-операции. Позволяет проверить или изменить данные до внесения в таблицу (контроль целостности, преобразование значений), предотвратить некорректные данные.</li>
<li><b>AFTER</b> — после завершения операции: логирование, аудит, обновление агрегированных данных и связанных таблиц.</li>
<li><b>INSTEAD OF</b> — в основном для представлений (VIEW): вместо стандартных INSERT/UPDATE/DELETE выполняются альтернативные действия (например, изменение нескольких базовых таблиц).</li>
</ul>
<h4>По уровню срабатывания</h4>
<ul>
<li><b>FOR EACH ROW</b> («строчный») — для каждой затронутой строки; доступны <code>NEW</code> и <code>OLD</code>.</li>
<li><b>FOR EACH STATEMENT</b> («операторный») — один раз на весь SQL-оператор независимо от числа строк (по умолчанию).</li>
</ul>
<h4>По событию</h4>
<p><code>INSERT</code>, <code>UPDATE</code> (в том числе <code>UPDATE OF столбцы</code>), <code>DELETE</code>, <code>TRUNCATE</code>; события можно комбинировать через <code>OR</code>.</p>
<table>
<tr><th>Момент</th><th>Таблица (ROW)</th><th>Таблица (STATEMENT)</th><th>Представление</th></tr>
<tr><td>BEFORE</td><td>да</td><td>да</td><td>—</td></tr>
<tr><td>AFTER</td><td>да</td><td>да</td><td>—</td></tr>
<tr><td>INSTEAD OF</td><td>—</td><td>—</td><td>да (ROW)</td></tr>
</table>
`);

add(83,'Триггеры базы данных. Триггерная функция. Примеры',`
<p>В PostgreSQL срабатывание триггера запускает <b>триггерную функцию</b>, которую нужно создать <i>до</i> объявления триггера. Она не имеет аргументов (параметры передаются через <code>TG_ARGV</code>) и возвращает тип <code>TRIGGER</code>.</p>
<pre><code>CREATE FUNCTION имя() RETURNS TRIGGER AS $$
BEGIN
  тело;
  RETURN { NEW | OLD | NULL };
END;
$$ LANGUAGE plpgsql;</code></pre>
<h4>Специальные переменные</h4>
<ul>
<li><code>NEW</code> — строка после операции (INSERT, UPDATE);</li>
<li><code>OLD</code> — строка до операции (UPDATE, DELETE);</li>
<li><code>TG_OP</code> — вид операции ('INSERT', 'UPDATE', 'DELETE'), также <code>TG_NAME</code>, <code>TG_TABLE_NAME</code>, <code>TG_WHEN</code>.</li>
</ul>
<h4>Что возвращать</h4>
<ul>
<li>Функции для <code>FOR EACH STATEMENT</code> и <b>AFTER</b>-триггеры: возвращаемое значение игнорируется (обычно NULL).</li>
<li>BEFORE строчный: <code>RETURN NEW</code> — выполнить INSERT/UPDATE (с изменениями, внесёнными в NEW); <code>RETURN OLD</code> — разрешить DELETE; <code>RETURN NULL</code> — пропустить операцию для текущей строки, не прерывая оператор.</li>
</ul>
<h4>Пример: «журнал транзакций» для таблицы stock</h4>
<pre><code>CREATE TABLE stock_log (
  dml_type    CHAR(6),
  username    VARCHAR(256),
  day         DATE,
  id_old NUMERIC(5,0), unitprice_old NUMERIC(10,2), onhand_old NUMERIC(5,0),
  reorder_old NUMERIC(5,0), description_old VARCHAR(2000),
  id_new NUMERIC(5,0), unitprice_new NUMERIC(10,2), onhand_new NUMERIC(5,0),
  reorder_new NUMERIC(5,0), description_new VARCHAR(2000));

CREATE OR REPLACE FUNCTION log_stock() RETURNS TRIGGER AS $$
BEGIN
  IF TG_OP = 'DELETE' THEN
    INSERT INTO stock_log VALUES ('DELETE', current_user, current_date,
      OLD.id, OLD.unitprice, OLD.onhand, OLD.reorder, OLD.description,
      NULL, NULL, NULL, NULL, NULL);
    RETURN OLD;
  ELSIF TG_OP = 'UPDATE' THEN
    INSERT INTO stock_log VALUES ('UPDATE', current_user, current_date,
      OLD.id, OLD.unitprice, OLD.onhand, OLD.reorder, OLD.description,
      NEW.id, NEW.unitprice, NEW.onhand, NEW.reorder, NEW.description);
    RETURN NEW;
  ELSIF TG_OP = 'INSERT' THEN
    INSERT INTO stock_log VALUES ('INSERT', current_user, current_date,
      NULL, NULL, NULL, NULL, NULL,
      NEW.id, NEW.unitprice, NEW.onhand, NEW.reorder, NEW.description);
    RETURN NEW;
  END IF;
  RETURN NULL;
END;
$$ LANGUAGE plpgsql;

CREATE TRIGGER log_stock
  AFTER INSERT OR UPDATE OR DELETE ON stock
  FOR EACH ROW EXECUTE FUNCTION log_stock();</code></pre>
<p>Использование аргументов при создании триггера (<code>TG_ARGV[0]</code>) позволяет одной функции обслуживать несколько триггеров.</p>
`);

add(84,'Библиотечные функции PL/pgSQL. Числовые функции',`
<p>В PL/pgSQL доступны все встроенные функции SQL PostgreSQL. Числовые:</p>
<table>
<tr><th>Функция</th><th>Описание</th><th>Пример</th></tr>
<tr><td><code>ABS(x)</code></td><td>модуль</td><td>ABS(-5) = 5</td></tr>
<tr><td><code>CEIL(x)</code>, <code>FLOOR(x)</code></td><td>округление вверх / вниз</td><td>CEIL(4.2) = 5; FLOOR(4.8) = 4</td></tr>
<tr><td><code>ROUND(x [, n])</code></td><td>округление до n знаков</td><td>ROUND(3.14159, 2) = 3.14</td></tr>
<tr><td><code>TRUNC(x [, n])</code></td><td>отбрасывание дробной части</td><td>TRUNC(3.99) = 3</td></tr>
<tr><td><code>MOD(x, y)</code>, <code>x % y</code></td><td>остаток от деления</td><td>MOD(10, 3) = 1</td></tr>
<tr><td><code>POWER(x, y)</code>, <code>SQRT(x)</code></td><td>степень, корень</td><td>SQRT(120) ≈ 10.954</td></tr>
<tr><td><code>EXP, LN, LOG</code></td><td>экспонента, логарифмы</td><td>LN(2.718) ≈ 1</td></tr>
<tr><td><code>SIGN(x)</code></td><td>знак числа</td><td>SIGN(-3) = -1</td></tr>
<tr><td><code>RANDOM()</code></td><td>случайное число от 0 до 1</td><td></td></tr>
<tr><td><code>GREATEST, LEAST</code></td><td>наибольшее / наименьшее из списка</td><td>GREATEST(1,5,3) = 5</td></tr>
</table>
<pre><code>DO $$
DECLARE r NUMERIC := 2.5;
BEGIN
  RAISE NOTICE 'Площадь круга: %', ROUND(PI() * POWER(r, 2), 2);   -- 19.63
  RAISE NOTICE 'Остаток: %', MOD(17, 5);                            -- 2
END; $$;</code></pre>
`);

add(85,'Библиотечные функции PL/pgSQL. Функции символьного типа',`
<table>
<tr><th>Функция</th><th>Описание</th><th>Пример</th></tr>
<tr><td><code>UPPER, LOWER, INITCAP</code></td><td>регистр символов</td><td>INITCAP('иван петров') = 'Иван Петров'</td></tr>
<tr><td><code>LENGTH(s)</code></td><td>длина строки</td><td>LENGTH('база') = 4</td></tr>
<tr><td><code>SUBSTR(s, from [, n])</code></td><td>подстрока</td><td>SUBSTR('Postgres', 1, 4) = 'Post'</td></tr>
<tr><td><code>POSITION(sub IN s)</code>, <code>STRPOS</code></td><td>позиция подстроки</td><td>POSITION('g' IN 'Postgres') = 5</td></tr>
<tr><td><code>REPLACE(s, from, to)</code></td><td>замена подстроки</td><td></td></tr>
<tr><td><code>TRIM, LTRIM, RTRIM</code></td><td>удаление пробелов/символов</td><td>TRIM('  а  ') = 'а'</td></tr>
<tr><td><code>LPAD(s, n, fill)</code>, <code>RPAD</code></td><td>дополнение до длины n</td><td>LPAD('7', 3, '0') = '007'</td></tr>
<tr><td><code>CONCAT(a, b, …)</code>, <code>||</code></td><td>конкатенация</td><td>CONCAT(firstname,' ',lastname)</td></tr>
<tr><td><code>LEFT, RIGHT, REVERSE, REPEAT</code></td><td>начало, конец, обратный порядок, повторение</td><td></td></tr>
<tr><td><code>SPLIT_PART(s, delim, n)</code></td><td>n-я часть строки</td><td></td></tr>
<tr><td><code>CHR(n), ASCII(c)</code></td><td>символ ↔ код</td><td></td></tr>
</table>
<pre><code>SELECT CONCAT(firstname, ' ', lastname) AS name FROM customer;   -- пример из лекций
SELECT UPPER(lastname) || ', ' || firstname FROM customer;
SELECT LPAD(id::text, 6, '0') FROM orders;</code></pre>
`);

add(86,'Библиотечные функции PL/pgSQL. Функции для работы с датой и временем',`
<table>
<tr><th>Функция</th><th>Описание</th></tr>
<tr><td><code>CURRENT_DATE</code>, <code>CURRENT_TIME</code>, <code>CURRENT_TIMESTAMP</code>, <code>NOW()</code></td><td>текущие дата и время (аналог <code>SYSDATE</code> в Oracle)</td></tr>
<tr><td><code>EXTRACT(поле FROM значение)</code>, <code>DATE_PART</code></td><td>год, месяц, день, час, dow (день недели) и т.д.</td></tr>
<tr><td><code>DATE_TRUNC('month', ts)</code></td><td>усечение до месяца, дня, часа…</td></tr>
<tr><td><code>AGE(d1 [, d2])</code></td><td>интервал между датами (возраст)</td></tr>
<tr><td><code>MAKE_DATE(y, m, d)</code></td><td>создание даты из частей</td></tr>
<tr><td><code>TO_CHAR / TO_DATE / TO_TIMESTAMP</code></td><td>преобразование в строку и обратно</td></tr>
<tr><td>арифметика <code>+</code>, <code>-</code> с <code>INTERVAL</code></td><td>сдвиг даты</td></tr>
</table>
<pre><code>SELECT NOW(), CURRENT_DATE;
SELECT EXTRACT(YEAR FROM orderdate) AS y, COUNT(*) FROM orders GROUP BY y;
SELECT DATE_TRUNC('month', CURRENT_DATE);
SELECT CURRENT_DATE + INTERVAL '30 days';
SELECT AGE(CURRENT_DATE, DATE '2005-03-17');          -- возраст
SELECT '2026-12-31'::date - CURRENT_DATE;             -- дней до Нового года
INSERT INTO orders (id, customerid, orderdate) VALUES (34, 534, CURRENT_DATE);

DO $$
BEGIN
  IF EXTRACT(DOW FROM CURRENT_DATE) IN (0, 6) THEN
    RAISE NOTICE 'Выходной';
  END IF;
END; $$;</code></pre>
`);

add(87,'Библиотечные функции PL/pgSQL. Функции преобразования типов',`
<p>Преобразование типов в PL/pgSQL выполняется теми же средствами, что и в SQL; оно бывает неявным и явным.</p>
<table>
<tr><th>Функция</th><th>Назначение</th></tr>
<tr><td><code>CAST(x AS тип)</code>, <code>x::тип</code></td><td>универсальное явное преобразование</td></tr>
<tr><td><code>TO_CHAR(x, формат)</code></td><td>число, дата, интервал → строка</td></tr>
<tr><td><code>TO_NUMBER(s, формат)</code></td><td>строка → NUMERIC</td></tr>
<tr><td><code>TO_DATE(s, формат)</code>, <code>TO_TIMESTAMP(s, формат)</code></td><td>строка → дата/время</td></tr>
<tr><td><code>quote_literal, quote_ident</code></td><td>экранирование значений при динамическом SQL</td></tr>
</table>
<pre><code>DO $$
DECLARE
  s   TEXT := '125';
  n   INTEGER;
  d   DATE;
BEGIN
  n := s::INTEGER + 5;                                  -- 130
  d := TO_DATE('25.11.2026', 'DD.MM.YYYY');
  RAISE NOTICE 'Сумма: %, дата: %', n, TO_CHAR(d, 'YYYY-MM-DD');
EXCEPTION
  WHEN invalid_text_representation THEN
    RAISE NOTICE 'Строка не является числом';
END; $$;</code></pre>
<p>Присваивание в PL/pgSQL (<code>:=</code>) неявно приводит значение к типу переменной, если это возможно; иначе возникает ошибка, которую обрабатывают блоком EXCEPTION (вопрос 79).</p>
`);

add(88,'Библиотечные функции PL/pgSQL. Групповые функции',`
<p>Групповые (агрегатные) функции вычисляют одно значение по набору строк; в PL/pgSQL используются внутри SQL-запросов, результат присваивают переменной с помощью <code>SELECT … INTO</code>.</p>
<table>
<tr><th>Функция</th><th>Описание</th></tr>
<tr><td><code>COUNT(*)</code>, <code>COUNT(x)</code>, <code>COUNT(DISTINCT x)</code></td><td>число строк / значений не-NULL / различных значений</td></tr>
<tr><td><code>SUM(x)</code>, <code>AVG(x)</code></td><td>сумма, среднее</td></tr>
<tr><td><code>MIN(x)</code>, <code>MAX(x)</code></td><td>минимум, максимум</td></tr>
<tr><td><code>STRING_AGG(x, разделитель)</code></td><td>склеивание значений в строку</td></tr>
<tr><td><code>ARRAY_AGG(x)</code></td><td>сбор значений в массив</td></tr>
<tr><td><code>BOOL_AND / BOOL_OR</code></td><td>логические агрегаты</td></tr>
</table>
<pre><code>DO $$
DECLARE
  cnt  INTEGER;
  tot  NUMERIC;
  mx   NUMERIC;
BEGIN
  SELECT COUNT(*), SUM(total), MAX(total)
    INTO cnt, tot, mx
  FROM orders WHERE customerid = 137;
  RAISE NOTICE 'Заказов: %, сумма: %, максимум: %', cnt, tot, mx;
END; $$;

-- по группам: цикл по результату
DO $$
DECLARE r RECORD;
BEGIN
  FOR r IN SELECT state, COUNT(*) AS c FROM customer GROUP BY state HAVING COUNT(*) &gt; 1 LOOP
    RAISE NOTICE '%: %', r.state, r.c;
  END LOOP;
END; $$;</code></pre>
<p>Агрегаты игнорируют NULL (кроме <code>COUNT(*)</code>); для пустого набора SUM/AVG/MIN/MAX возвращают NULL. Для сводки по группам — предложения GROUP BY и HAVING (вопросы 53–54); агрегаты можно применять и как оконные функции (<code>SUM(x) OVER (PARTITION BY ...)</code>).</p>
`);

Q.sort(function(a,b){return a.n-b.n;});
const GROUPS=[
  [1,12,'Информационные системы, БД и СУБД','Введение'],
  [13,17,'Архитектура СУБД, жизненный цикл, уровни БД','Архитектура'],
  [18,19,'Модели данных','Модели'],
  [20,36,'Реляционная модель и реляционная алгебра','Реляц. модель'],
  [37,42,'Проектирование: семантическое моделирование (ER)','ER-модели'],
  [43,70,'Язык SQL','SQL'],
  [71,88,'Функции и процедурный язык PL/pgSQL','PL/pgSQL']
];
const KEY='db-exam-done-v1';
let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){done={};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done));}catch(e){}}

const list=document.getElementById('list');
const chips=document.getElementById('chips');
const items=[];

GROUPS.forEach(function(g,gi){
  const h=document.createElement('h2');
  h.className='group';h.id='g'+gi;h.textContent=g[2];
  list.appendChild(h);
  g.h=h;g.items=[];
  const a=document.createElement('a');
  a.href='#g'+gi;a.textContent=g[3]+' ('+g[0]+'–'+g[1]+')';
  chips.appendChild(a);
  Q.filter(function(x){return x.n>=g[0]&&x.n<=g[1];}).forEach(function(x){
    const art=document.createElement('article');
    art.className='item';art.id='q'+x.n;
    art.innerHTML='<button class="head" aria-expanded="false" aria-controls="b'+x.n+'">'+
      '<span class="num">'+x.n+'</span><span class="title"></span>'+
      '<span class="mark" aria-hidden="true">✓</span><span class="chev" aria-hidden="true"></span></button>'+
      '<div class="body" id="b'+x.n+'"><div class="clip"><div class="inner">'+x.a+
      '<button class="btn donebtn" type="button"></button></div></div></div>';
    art.querySelector('.title').textContent=x.q;
    const head=art.querySelector('.head');
    const db=art.querySelector('.donebtn');
    function refresh(){
      const d=!!done[x.n];
      art.classList.toggle('done',d);
      db.textContent=d?'✓ Изучено (снять отметку)':'Отметить как изученное';
    }
    head.addEventListener('click',function(){
      const open=!art.classList.contains('open');
      art.classList.toggle('open',open);
      head.setAttribute('aria-expanded',open);
      if(open){try{history.replaceState(null,'','#q'+x.n);}catch(e){}}
    });
    db.addEventListener('click',function(){
      done[x.n]=!done[x.n];if(!done[x.n])delete done[x.n];
      save();refresh();stats();
    });
    refresh();
    list.appendChild(art);
    const rec={n:x.n,el:art,head:head,text:(x.n+' '+x.q+' '+art.querySelector('.inner').textContent).toLowerCase(),refresh:refresh};
    items.push(rec);g.items.push(rec);
  });
});

function stats(){
  const d=Object.keys(done).length;
  document.getElementById('bar').style.width=(d/Q.length*100)+'%';
  const vis=items.filter(function(i){return !i.el.classList.contains('hidden');}).length;
  document.getElementById('stat').textContent='Изучено: '+d+' из '+Q.length+(vis!==Q.length?' · найдено вопросов: '+vis:'');
}
stats();

const input=document.getElementById('q');
function filter(){
  const t=input.value.trim().toLowerCase();
  const words=t.split(/\s+/).filter(Boolean);
  let any=false;
  GROUPS.forEach(function(g){
    let shown=0;
    g.items.forEach(function(i){
      const ok=words.every(function(w){return i.text.indexOf(w)!==-1;});
      i.el.classList.toggle('hidden',!ok);
      if(ok){shown++;any=true;}
    });
    g.h.classList.toggle('hidden',shown===0);
  });
  document.getElementById('empty').style.display=any?'none':'block';
  stats();
}
input.addEventListener('input',filter);

function setAll(open){
  items.forEach(function(i){
    if(i.el.classList.contains('hidden'))return;
    i.el.classList.toggle('open',open);
    i.head.setAttribute('aria-expanded',open);
  });
}
document.getElementById('expandAll').onclick=function(){setAll(true);};
document.getElementById('collapseAll').onclick=function(){setAll(false);};

const root=document.documentElement;
try{const s=localStorage.getItem('db-exam-theme');if(s)root.setAttribute('data-theme',s);}catch(e){}
if(!root.getAttribute('data-theme')&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches){root.setAttribute('data-theme','dark');}
document.getElementById('theme').onclick=function(){
  const n=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',n);
  try{localStorage.setItem('db-exam-theme',n);}catch(e){}
};

// открытие вопроса по ссылке #qN
function openHash(){
  const m=/^#q(\d+)$/.exec(location.hash);
  if(!m)return;
  const it=items.filter(function(i){return i.n===+m[1];})[0];
  if(it){it.el.classList.add('open');it.head.setAttribute('aria-expanded','true');
    setTimeout(function(){it.el.scrollIntoView({block:'start'});},50);}
}
window.addEventListener('hashchange',openHash);
openHash();
</script>
