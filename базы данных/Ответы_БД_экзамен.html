add(1,'Понятие информационной системы',`
<div class="def"><b>Информационная система (ИС)</b> — взаимосвязанная совокупность аппаратных средств, математических методов и моделей, программного обеспечения, персонала и информационных технологий (в том числе сетевых), используемая для создания, хранения и обработки больших массивов информации с целью описания <i>актуального состояния конкретной предметной области</i>.</div>
<h4>Из чего состоит ИС</h4>
<ul>
<li><b>Аппаратное обеспечение</b> — компьютеры, серверы, сетевое оборудование, внешние запоминающие устройства (ВЗУ).</li>
<li><b>Математические методы и модели</b> — модели данных (иерархическая, сетевая, реляционная), алгоритмы поиска и обработки.</li>
<li><b>Программное обеспечение</b> — СУБД, прикладные программы (ПП), клиентские приложения.</li>
<li><b>Персонал</b> — администраторы БД, разработчики, пользователи.</li>
<li><b>Информационные технологии</b> — технологии БД, сетевые технологии, технологии защиты информации.</li>
</ul>
<h4>Примеры</h4>
<p>ИС «Деканат» (студенты, оценки, преподаватели), библиотечная ИС, банковская система, система бронирования билетов, ЕГАИС, электронный документооборот.</p>
<div class="note">Конечная цель всех технологий БД — проектирование и разработка информационных систем. Нельзя отождествлять ИС и БД: база данных — лишь <i>фундамент</i> ИС (подробнее — вопросы 3–4).</div>
`);

add(2,'Классификация информационных систем. Примеры',`
<p>ИС, как и другие сложные системы, классифицируют по разным параметрам.</p>
<h4>1. По архитектуре (по способу организации СУБД)</h4>
<ul>
<li><b>Локальные</b> — все данные и все ПО находятся на одном персональном компьютере (Access, SQLite).</li>
<li><b>Файл/сервер</b> — один компьютер одноранговой сети хранит файлы данных, остальные обращаются к ним по сети. Обработка выполняется на клиентах (Windows 95, dBase, FoxPro).</li>
<li><b>Клиент/сервер</b> — самая массовая архитектура: сервер хранит данные и обрабатывает запросы, клиент (как правило «тонкий») лишь отображает результаты (PostgreSQL, Oracle, MS SQL Server).</li>
<li><b>Распределённые</b> — данные физически разнесены в пространстве (вплоть до континентов), но образуют единое логическое пространство.</li>
</ul>
<h4>2. По способу обработки данных</h4>
<ul>
<li><b>Транзакционные</b> (OLTP) — «мгновенная» обработка множества коротких операций: банкомат, касса, бронирование.</li>
<li><b>Системы принятия решений (СПР, OLAP)</b> — результаты выдаются после продолжительного отбора и анализа данных в разных разрезах: качественном, количественном, временном, географическом.</li>
<li><b>Информационно-справочные системы</b> — запрос и получение информации (например, интернет, КЛАДР, справочные порталы).</li>
<li><b>Офисные ИС</b> — электронный документооборот (создание документов, согласование, электронная подпись), например DocsVision.</li>
</ul>
<h4>3. По сфере применения</h4>
<ul>
<li>бухгалтерские и финансовые ИС;</li>
<li><b>экспертные системы</b> — хранят не данные, а знания;</li>
<li>образовательные ИС (деканат, электронные журналы);</li>
<li>военные, медицинские, производственные, транспортные и др.</li>
</ul>
`);

add(3,'Общее представление о базе данных. Сравнение с данными прикладных программ',`
<p>Многие отождествляют ИС и БД — это неверно. Чтобы понять, что такое «база данных», сравним хранение и обработку данных в прикладных программах (ПП) и в ИС на основе БД.</p>
<table>
<tr><th>№</th><th>Данные прикладной программы</th><th>Данные БД</th></tr>
<tr><td>1</td><td>Переменные живут наносекунды — пока работает программа.</td><td>Хранятся «вечно» (на ВЗУ, в файлах БД).</td></tr>
<tr><td>2</td><td>Предназначены для одной программы.</td><td>Используются множеством ПП (10, 100, 1000).</td></tr>
<tr><td>3</td><td>Обезличены, не имеют семантики.</td><td>Имеют семантику — на этом основано проектирование, она предотвращает некорректное сравнение данных.</td></tr>
<tr><td>4</td><td>Простые типы никак не связаны друг с другом.</td><td>Обязательно связаны ⇒ проблема <b>целостности</b> (паспорт должен принадлежать именно Иванову И. И., а не Сидорову П. П.).</td></tr>
<tr><td>5</td><td>Простая структура (даже классы и массивы).</td><td>Очень сложная структура в совокупности.</td></tr>
</table>
<p><b>Вывод:</b> при создании и работе с БД необходимо учитывать все пять аспектов: долговременность, общий доступ, семантику, связность и сложность структуры.</p>
`);

add(4,'Определение БД как структуры данных. Примеры',`
<div class="def"><b>База данных</b> — сложно структурированная, поименованная и связанная между собой совокупность больших массивов данных, позволяющих описывать актуальное состояние конкретной предметной области.</div>
<p><b>Главное:</b> БД — это <i>структура данных</i>, а не информационная система. БД — фундамент, на котором строится «здание» ИС БД: над данными надстраиваются прикладные программы, использующие данные БД.</p>
<pre><code>Прикладные программы (клиенты)
─────────────────────────────
         СУБД
─────────────────────────────
    База данных (файлы БД)</code></pre>
<h4>Примеры</h4>
<ul>
<li><b>Учебная БД «Деканат»</b> из четырёх отношений: <code>Student(N_z, Fam, Name, Studentship)</code>, <code>Teacher(Kod, FIO)</code>, <code>Subject(Kod, Name)</code>, <code>Mark(Mark, N, Kod_S, Kod_T)</code>.</li>
<li>БД оптовой торговой фирмы: покупатели, накладные, товары, склады.</li>
<li>БД библиотеки: книги (ISBN), авторы, читатели, выдачи.</li>
</ul>
`);

add(5,'Назначение и понятие СУБД',`
<p>Проектирование и реализация такой нетривиальной структуры, как БД, и сложных систем на её основе оказались настолько трудными, что для них создан специальный класс ПО — СУБД.</p>
<div class="def"><b>СУБД (система управления базами данных)</b> — комплекс программных и языковых средств (включая инструменты для разработки прикладных программ), предназначенный для проектирования и реализации как БД, так и ИС на её основе.</div>
<h4>Основные функции СУБД</h4>
<ol>
<li>Проектирование и реализация сложных структурированных связных данных.</li>
<li>Ввод, редактирование и удаление практически неограниченного объёма данных.</li>
<li>Долговременное хранение данных на ВЗУ в виде файлов.</li>
<li>Управление буферами оперативной памяти.</li>
<li>Управление транзакциями.</li>
<li>Журнализация и восстановление данных после сбоев.</li>
<li>Поддержка специальных языков (SQL).</li>
<li>Обеспечение безопасности хранения и доступа к данным.</li>
</ol>
<p>Примеры СУБД: PostgreSQL, Oracle Database, MySQL/MariaDB, Microsoft SQL Server, SQLite, Microsoft Access, LibreOffice Base.</p>
`);

add(6,'Основные функции СУБД. Функции для работы с данными БД',`
<p>Это набор функций для <b>ввода, редактирования, удаления и поиска</b> практически неограниченного объёма сложно структурированных и связанных между собой данных.</p>
<ul>
<li><b>Ввод</b> — добавление новых записей (кортежей): <code>INSERT</code>.</li>
<li><b>Редактирование</b> — изменение значений атрибутов существующих записей: <code>UPDATE</code>.</li>
<li><b>Удаление</b> — <code>DELETE</code>.</li>
<li><b>Выборка и поиск</b> — <code>SELECT</code>; для ускорения СУБД использует индексные файлы и сортировку.</li>
<li><b>Контроль целостности</b> — при каждой операции СУБД проверяет ограничения: первичные и внешние ключи, <code>NOT NULL</code>, <code>CHECK</code>, <code>UNIQUE</code>.</li>
</ul>
<pre><code>INSERT INTO Student(N_z, Fam, Name, Studentship)
VALUES ('190118', 'Ге', 'Николай', 2000.00);

UPDATE Student SET Fam = 'Петрова' WHERE N_z = '190102';

DELETE FROM Student WHERE N_z = '190199';</code></pre>
<p>Все эти операции выполняются в рамках механизма транзакций, поэтому данные остаются согласованными даже при сбоях.</p>
`);

add(7,'Основные функции СУБД. Функции управления буферами ОП',`
<p>При запуске СУБД операционная система создаёт процесс СУБД и выделяет ему большие блоки оперативной памяти (ОП). Именно этими блоками — <b>буферами</b> — и должна управлять СУБД.</p>
<h4>Зачем нужны буферы</h4>
<p>Доступ к диску на порядки медленнее, чем к ОП. СУБД хранит в ОП копии часто используемых страниц файлов БД (<i>буферный пул, кэш</i>), чтобы сократить число обращений к диску.</p>
<h4>Что делает СУБД</h4>
<ul>
<li>читает нужные страницы данных и индексов с диска в буфер;</li>
<li>отслеживает «грязные» страницы — изменённые в ОП, но ещё не записанные на диск;</li>
<li>вытесняет страницы при нехватке памяти по алгоритму замещения (LRU и его варианты), предварительно сохранив изменённые;</li>
<li>периодически сбрасывает данные на диск (контрольные точки), согласуя это с журналом транзакций;</li>
<li>буферизует и сам журнал транзакций.</li>
</ul>
<p>В PostgreSQL размер основного буфера задаётся параметром <code>shared_buffers</code>.</p>
`);

add(8,'Основные функции СУБД. Поддержка языка SQL',`
<p>Из-за специфики структур данных типа БД и принципиального отличия хранения данных от ПП СУБД использует специальные языки для проектирования, создания, хранения и доступа к данным. Все современные СУБД поддерживают <b>SQL (Structured Query Language)</b>.</p>
<ul>
<li>SQL — <b>декларативный (непроцедурный)</b> язык: пользователь указывает <i>что</i> нужно получить, а не <i>как</i>; СУБД сама строит план выполнения запроса.</li>
<li>Является языком запросов к данным БД со стороны пользователя и ПП.</li>
<li>Стандартизован ANSI/ISO; каждая СУБД имеет собственный диалект и процедурное расширение (PL/pgSQL в PostgreSQL, PL/SQL в Oracle, T-SQL в MS SQL Server).</li>
</ul>
<h4>Группы команд</h4>
<table><tr><th>Группа</th><th>Назначение</th><th>Команды</th></tr>
<tr><td>DDL</td><td>определение данных</td><td>CREATE, ALTER, DROP</td></tr>
<tr><td>DML/DSL</td><td>манипулирование и выборка</td><td>SELECT, INSERT, UPDATE, DELETE</td></tr>
<tr><td>DCL</td><td>управление доступом</td><td>GRANT, REVOKE</td></tr>
<tr><td>DTL</td><td>управление транзакциями</td><td>COMMIT, ROLLBACK, SAVEPOINT</td></tr></table>
<p>Для грамотного специалиста по БД знание SQL обязательно.</p>
`);

add(9,'Основные функции СУБД. Функции хранения данных БД',`
<p>СУБД обеспечивает <b>долговременное хранение</b> практически неограниченных объёмов сложно структурированных и связанных данных на внешних запоминающих устройствах (ВЗУ) в виде файлов.</p>
<ul>
<li><b>Файлы данных</b> — содержат записи таблиц (тела отношений).</li>
<li><b>Индексные файлы</b> — вспомогательные структуры для быстрого поиска.</li>
<li><b>Журнал транзакций</b> — файлы с записью всех изменений.</li>
<li><b>Служебные файлы</b> — системный каталог (словарь данных): описание таблиц, столбцов, ограничений, пользователей и привилегий.</li>
<li><b>Архивы</b> — резервные копии на независимых от БД устройствах.</li>
</ul>
<p>Данные хранятся постранично (блоками фиксированного размера, например 8 КБ в PostgreSQL). СУБД скрывает от пользователя физические детали: имена файлов, адреса записей, способ размещения — это <i>внутренний (физический) уровень</i> трёхуровневой архитектуры. В PostgreSQL для распределения данных по дискам служат <b>табличные пространства</b> (<code>CREATE TABLESPACE</code>).</p>
`);

add(10,'Основные функции СУБД. Функции обеспечения безопасности хранения и доступа к данным',`
<h4>Безопасность хранения</h4>
<ul>
<li>журнализация и восстановление после аппаратных и программных сбоев;</li>
<li>периодическое архивирование (резервное копирование) БД на независимые носители;</li>
<li>механизм транзакций (атомарность, откат при ошибках);</li>
<li>поддержание целостности: ключи, ограничения, триггеры.</li>
</ul>
<h4>Безопасность доступа</h4>
<ul>
<li><b>Аутентификация</b> — проверка личности пользователя (логин/пароль, сертификаты).</li>
<li><b>Авторизация</b> — проверка прав: какие операции над какими объектами разрешены. Реализуется командами DCL — <code>GRANT</code> и <code>REVOKE</code>, а также ролями.</li>
<li><b>Представления (VIEW)</b> — открывают пользователю только часть столбцов и строк таблицы.</li>
<li><b>Шифрование</b> данных и каналов связи, <b>аудит</b> действий пользователей.</li>
</ul>
<pre><code>GRANT SELECT ON customer TO jefferson;
REVOKE SELECT ON customer FROM jefferson;</code></pre>
`);

add(11,'Фундаментальное понятие «Механизм транзакций СУБД»',`
<p>Механизм транзакций в современных СУБД, особенно распределённых, имеет фундаментальное системообразующее значение.</p>
<div class="def"><b>Транзакция</b> — группа команд SQL (или его диалекта), которая рассматривается СУБД как единое целое: либо выполняются все операции, либо ни одной.</div>
<ul>
<li><b>«Истинная» транзакция</b> — все операции завершены с кодом 0 (без ошибок). Результат — необратимое сохранение всех изменений на ВЗУ (<code>COMMIT</code>).</li>
<li><b>«Ложная» транзакция</b> — хотя бы одна операция не завершена или завершена с ненулевым кодом. Результат — <b>откат (ROLLBACK)</b>: отмена всех изменений и неявное начало новой транзакции.</li>
</ul>
<h4>Свойства ACID</h4>
<ul>
<li><b>A</b>tomicity — атомарность (всё или ничего);</li>
<li><b>C</b>onsistency — согласованность (БД переходит из одного корректного состояния в другое);</li>
<li><b>I</b>solation — изолированность параллельных транзакций;</li>
<li><b>D</b>urability — долговечность (зафиксированные изменения не теряются).</li>
</ul>
<h4>Пример</h4>
<pre><code>BEGIN;
UPDATE account SET balance = balance - 1000 WHERE id = 1;
UPDATE account SET balance = balance + 1000 WHERE id = 2;
COMMIT;   -- при ошибке в любой из операций: ROLLBACK;</code></pre>
<p>Простейший пример из лекций — смена фамилии студентки в ИС «Деканат». Транзакция выполняется в оперативной памяти и лишь по COMMIT фиксируется на диске.</p>
`);

add(12,'Журнал транзакций',`
<p>Абсолютно все операции и изменения данных БД автоматически сохраняются в специальном файле (файлах) — <b>журнале транзакций</b> (в PostgreSQL — WAL, Write-Ahead Log). Журнализация — один из самых надёжных механизмов гарантированно безопасного хранения данных.</p>
<h4>Принцип «журнал вперёд»</h4>
<p>Запись об изменении попадает в журнал на диск <i>раньше</i>, чем изменённая страница данных, и раньше, чем транзакции будет разрешено завершиться.</p>
<h4>Схема восстановления после сбоя</h4>
<ol>
<li>Данные БД периодически архивируются и сохраняются на носителях, не зависящих от БД.</li>
<li>Журнал транзакций ведёт отсчёт с момента предыдущего архивирования.</li>
<li>При аварии данные извлекаются из архива и запускается журнал, который автоматически повторяет все операции за утраченный период.</li>
</ol>
<p>Образно: журнал транзакций — «попугай», который повторяет всё, что произошло.</p>
<p>Журнал также используется для отката незавершённых транзакций и для репликации. Аналог на уровне триггеров — таблица аудита, например <code>Stock_Log</code> (см. вопрос 83).</p>
`);

add(13,'Локальные СУБД. Примеры',`
<p>В локальной архитектуре и данные, и СУБД, и прикладные программы находятся на одном компьютере. Нет сетевого взаимодействия; как правило, один пользователь (или очень мало).</p>
<h4>Особенности</h4>
<ul>
<li>простота установки и администрирования;</li>
<li>низкая стоимость, часто встраивается в приложение;</li>
<li>ограниченная многопользовательская работа, слабая защита и масштабируемость.</li>
</ul>
<h4>Примеры</h4>
<ul>
<li>Microsoft Access, LibreOffice Base (OpenOffice Base);</li>
<li>SQLite — встраиваемая СУБД (браузеры, мобильные приложения);</li>
<li>dBase, FoxPro, Paradox (файловые СУБД; формат .dbf, например КЛАДР).</li>
</ul>
<p>Родственная архитектура <b>файл/сервер</b>: файлы БД лежат на выделенном компьютере сети, но вся обработка идёт на клиентах, а по сети гоняются файлы целиком.</p>
`);

add(14,'Клиент-серверные СУБД. Примеры',`
<p>Функции клиента и сервера принципиально разделены. <b>Сервер</b> хранит данные, выполняет запросы, контролирует целостность, безопасность и транзакции. <b>Клиент</b> отправляет запросы на SQL и отображает результат; современные клиенты — «тонкие».</p>
<h4>Преимущества</h4>
<ul>
<li>по сети передаются только запросы и результаты (а не файлы целиком);</li>
<li>централизованное хранение, администрирование, резервирование и защита;</li>
<li>многопользовательский режим с изоляцией транзакций;</li>
<li>серверная логика: хранимые процедуры, функции, триггеры (PL/pgSQL).</li>
</ul>
<h4>Примеры</h4>
<p>PostgreSQL, Oracle Database, Microsoft SQL Server, MySQL/MariaDB, Firebird, IBM Db2.</p>
<pre><code>Клиент 1 ─┐
Клиент 2 ─┼── SQL-запросы ──► Сервер СУБД ──► Файлы БД
Клиент N ─┘ ◄── результат ──</code></pre>
<p>Это самая массовая архитектура на сегодняшний день.</p>
`);

add(15,'Распределённые СУБД. Примеры',`
<p>В распределённой архитектуре данные ИС <b>физически разнесены</b> в пространстве (вплоть до континентов), но пользователю <b>представляются единым логическим пространством</b> — единой БД.</p>
<h4>Ключевые механизмы</h4>
<ul>
<li><b>Фрагментация</b> (горизонтальная и вертикальная, шардинг) — разбиение таблиц по узлам;</li>
<li><b>Репликация</b> — копирование данных на несколько узлов для надёжности и скорости чтения;</li>
<li><b>Распределённые транзакции</b> — согласованная фиксация на нескольких узлах (двухфазный коммит, 2PC);</li>
<li>прозрачность расположения: пользователь не знает, на каком узле лежат данные.</li>
</ul>
<h4>Примеры</h4>
<p>Oracle (распределённые БД, Oracle RAC), Google Spanner, CockroachDB, Apache Cassandra, MongoDB (шардинг), PostgreSQL с расширением Citus; системы бронирования авиабилетов, глобальные банковские системы, сети операторов сотовой связи.</p>
<p>Недостатки: сложность администрирования, сетевые задержки, трудности поддержания целостности.</p>
`);

add(16,'Жизненный цикл базы данных',`
<p>Жизненный цикл реляционной БД (ЖЦРБД) — период от замысла до вывода из эксплуатации. Две фундаментальные особенности: заголовок отношения статичен весь ЖЦ, тело отношения динамично.</p>
<ol>
<li><b>Планирование и анализ предметной области</b> — изучение документации, беседы с экспертами, формулирование требований.</li>
<li><b>Концептуальное (семантическое) проектирование</b> — ER-модель: сущности, атрибуты, связи.</li>
<li><b>Логическое проектирование</b> — выбор модели данных (реляционная), преобразование ER-модели в отношения, ключи, домены.</li>
<li><b>Физическое проектирование</b> — выбор СУБД, типов данных, индексов; физическая ER-модель.</li>
<li><b>Реализация</b> — создание объектов БД на SQL (DDL).</li>
<li><b>Загрузка данных</b> и разработка прикладных программ.</li>
<li><b>Тестирование</b>.</li>
<li><b>Эксплуатация и сопровождение</b> — резервное копирование, оптимизация, администрирование, изменение требований.</li>
<li><b>Реорганизация или вывод из эксплуатации.</b></li>
</ol>
<p>Метод проектирования итерационный: на каждом шаге допускается и рекомендуется уточнение модели и исправление ошибок.</p>
`);

add(17,'Трёхуровневая структура БД. Логический, физический и внешний уровни БД',`
<p>Проектирование и реализация БД настолько сложны, что теоретики рекомендуют рассматривать БД в трёх независимых и одновременно логически едином аспектах. Трёхуровневая архитектура — <b>ANSI/SPARC</b>.</p>
<table>
<tr><th>Уровень</th><th>Название</th><th>Что описывает</th></tr>
<tr><td>1</td><td><b>Концептуальный (логический)</b></td><td>Структура БД в целом: отношения, атрибуты, домены, ключи, связи, ограничения целостности. Не зависит от способа хранения.</td></tr>
<tr><td>2</td><td><b>Внутренний (физический)</b></td><td>Хранение на ВЗУ: файлы, записи, индексы, страницы, методы доступа.</td></tr>
<tr><td>3</td><td><b>Внешний (представлений)</b></td><td>Как данные видят пользователи и приложения: подмножества данных, представления (VIEW), таблицы, отчёты.</td></tr>
</table>
<h4>Пример</h4>
<ul>
<li>Логический: отношение <code>Student(N_z, Fam, Name, Studentship)</code>.</li>
<li>Физический: файл данных + индексный файл по <code>N_z</code>.</li>
<li>Внешний: таблица в окне ИС «Деканат» или <code>VIEW</code> без столбца Studentship.</li>
</ul>
<p>Благодаря независимости уровней изменение физического хранения не требует переписывать приложения (физическая независимость), а изменение логической структуры — минимально затрагивает представления (логическая независимость).</p>
`);
add(18,'Иерархическая модель данных. Пример',`
<p>В основе иерархической модели лежит теория графов. Объекты реального мира описываются <b>ориентированным графом — деревом</b>. Основные понятия: <b>уровень</b>, <b>узел</b> (совокупность атрибутов объекта) и <b>связь</b>. Главное правило: любой дочерний узел имеет <b>только одного родителя</b>.</p>
<h4>Пример</h4>
<pre><code>Университет                      (корень, уровень 1)
 ├── Факультет «ИИ»              (уровень 2)
 │    ├── Кафедра ИиВМ           (уровень 3)
 │    │    ├── Преподаватель Луканов А.С.   (уровень 4)
 │    │    └── Преподаватель Воропаева Н.В.
 │    └── Кафедра ...
 └── Факультет «Математика»</code></pre>
<h4>Достоинства</h4>
<ul><li>мгновенный поиск и доступ по пути от корня;</li><li>простота реализации и наглядность.</li></ul>
<h4>Недостатки</h4>
<ul>
<li><b>избыточность данных</b> — если преподаватель работает на двух кафедрах, его данные придётся дублировать;</li>
<li>невозможность естественно описать связи «многие-ко-многим»;</li>
<li>сложность изменения структуры, зависимость программ от структуры данных.</li>
</ul>
<p>Исторический пример СУБД — IBM IMS.</p>
`);

add(19,'Сетевая модель данных. Пример',`
<p>Сетевая структура данных отличается от иерархической одним фундаментальным свойством: в сетевой модели <b>любой узел, кроме корневого, может иметь несколько родителей</b>.</p>
<h4>Пример</h4>
<pre><code>Преподаватель 1 ──┐          ┌── Студент А
                  ├── Предмет ┤
Преподаватель 2 ──┘          └── Студент Б
                   Предмет 2 ──── Студент А</code></pre>
<p>Узел «Студент А» имеет двух родителей — «Предмет» и «Предмет 2». Аналог: оценка (узел) принадлежит и студенту, и предмету, и преподавателю.</p>
<h4>Достоинства</h4>
<ul><li>меньшая избыточность, чем в иерархической модели;</li><li>естественное описание связей «многие-ко-многим».</li></ul>
<h4>Недостатки</h4>
<ul><li>сложная навигационная структура, программист должен знать физическую организацию связей;</li><li>трудность модификации; нет единой математической основы.</li></ul>
<p>Историческая реализация — стандарт CODASYL (СУБД IDS, IDMS). Обе модели вытеснила <b>реляционная</b> (Кодд, Дейт), которой посвящена остальная часть курса.</p>
`);

add(20,'Три аспекта проектирования и реализации РБД',`
<p>В соответствии с трактовкой К. Дейта реляционная модель состоит из трёх частей (аспектов):</p>
<ol>
<li><b>Структурная.</b> Единственная структура данных — <b>n-арное реляционное отношение</b>. Простые типы данных, домены, атрибуты, ключи.</li>
<li><b>Целостная.</b> Главная проблема реляционных данных — целостность сложно связной структуры БД: <i>целостность сущностей</i> (первичные ключи не содержат NULL) и <i>ссылочная целостность</i> (внешние ключи).</li>
<li><b>Манипуляционная.</b> Правила обработки данных: реляционная алгебра или эквивалентное реляционное исчисление.</li>
</ol>
<p>Кроме того, реляционную БД проектируют и рассматривают на <b>трёх уровнях</b> ANSI/SPARC — логическом, физическом и внешнем (вопросы 17, 25). Метод проектирования — семантическое моделирование: концептуальная ER-модель → физическая ER-модель → реализация на SQL.</p>
`);

add(21,'Понятие домена. Примеры',`
<div class="def"><b>Домен</b> — семантическое понятие, подмножество простого типа данных. Характеризуется четырьмя свойствами:
<ol><li>уникальное имя в пределах всей БД;</li><li>определяется на простом типе данных либо на другом домене;</li><li>может иметь ограничения, сужающие подмножество типа;</li><li>имеет семантику (смысл).</li></ol></div>
<h4>Пример 1. Табельный номер</h4>
<ul><li>тип: целый; ограничение: 1001 ≤ ТН ≤ 9999;</li><li>семантика: первая цифра — номер отдела, три следующие — порядковый номер работника в отделе.</li></ul>
<h4>Пример 2. Номер зачётки (N_z)</h4>
<p>Текст фиксированной длины, 6 цифр, формат <code>yyssmm</code>: год поступления, код специальности, номер студента в группе.</p>
<h4>Главная роль домена</h4>
<p>Запрет сравнения данных, определённых на разных доменах, даже если подмножества типов совпадают. Домены «Возраст сотрудника» и «Число сотрудников в отделе» оба целые, 13 &lt; x &lt; 100, но «25 лет + 45 человек = 70 (?)» бессмысленно.</p>
<p>Отличие домена от атрибута: имя домена уникально в пределах БД, имя атрибута — только в пределах отношения. На этом основан механизм внешних ключей.</p>
`);

add(22,'Реляционное отношение. Заголовок и тело РО',`
<div class="def"><b>n-арное реляционное отношение</b> — структура данных, определяемая через <b>заголовок</b> и <b>тело</b>.</div>
<ul>
<li><b>Заголовок</b> <code>R(A1, A2, …, An)</code>: R — имя отношения, Ai — атрибуты, каждый — пара <code>{Ai : Di}</code> (имя + домен). Имя атрибута уникально в пределах отношения.</li>
<li><b>Тело</b> — множество кортежей <code>{a1, a2, …, an}</code>, где ai — значение атрибута Ai.</li>
</ul>
<p>Число атрибутов — <b>степень (арность)</b> отношения; число кортежей — <b>мощность</b>.</p>
<h4>Два фундаментальных свойства</h4>
<ol>
<li>Заголовок абсолютно <b>статичен</b> — не меняется на протяжении жизненного цикла РБД.</li>
<li>Тело абсолютно <b>динамично</b> — кортежи можно добавлять, изменять, удалять.</li>
</ol>
<h4>Пример: Student(N_z, Fam, Name, Studentship)</h4>
<table><tr><th>N_z</th><th>Fam</th><th>Name</th><th>Studentship</th></tr>
<tr><td>190118</td><td>Ге</td><td>Николай</td><td>2000,00</td></tr>
<tr><td>190108</td><td>Фет</td><td>Афанасий</td><td>2500,00</td></tr></table>
<p>Степень = 4, мощность тела = число строк. Реляционная БД — набор связанных между собой отношений.</p>
`);

add(23,'Реляционная модель данных',`
<p>Предложена Э. Ф. Коддом; наиболее распространённая трактовка принадлежит К. Дейту. РМД состоит из трёх частей:</p>
<ol>
<li><b>Структурная</b> — единственная структура — n-арное отношение.</li>
<li><b>Целостная</b> — целостность сущностей и внешних ключей.</li>
<li><b>Манипуляционная</b> — реляционная алгебра / реляционное исчисление.</li>
</ol>
<h4>Постулаты</h4>
<ul>
<li><b>Простота данных.</b> В отношении допустимы только простые (атомарные) типы: числовой, логический, символьный, строковый. Операции над ними выполняются как над единым целым, без учёта внутренней структуры (числа складывают, строки конкатенируют).</li>
<li><b>Домены.</b> Каждый атрибут определяется на домене; сравнивать можно только значения одного домена.</li>
<li>Реляционная БД — набор связанных между собой отношений.</li>
</ul>
<p>Отличия от других моделей: нет навигации по указателям, связи реализуются значениями атрибутов (внешними ключами), доступ — декларативный (SQL).</p>
`);

add(24,'Представление отношений в виде таблиц. Сравнение структур данных «отношения» и «таблицы»',`
<p>Тело отношения можно изобразить таблицей (это одна из причин популярности РМД), но отождествлять структуры — большая ошибка.</p>
<table>
<tr><th>Свойство</th><th>Отношение</th><th>Таблица</th></tr>
<tr><td>Одинаковые строки</td><td>Невозможны: тело — множество кортежей</td><td>Возможны (несколько совпадающих строк)</td></tr>
<tr><td>Порядок строк</td><td>Кортежи не упорядочены</td><td>Строки обычно упорядочены</td></tr>
<tr><td>Порядок столбцов</td><td>Атрибуты не упорядочены: Student(N_z, Fam, …) = Student(Fam, N_z, …)</td><td>Порядок столбцов существенен (зачётная ведомость)</td></tr>
<tr><td>Значения в ячейках</td><td>Атомарные (скалярные)</td><td>Могут быть выражения, массивы, записи</td></tr>
</table>
<p>Пример: столбец «ФИО» как вычисляемое выражение <code>Fam || ' ' || substr(Name,1,1) || '.'</code> — это таблица, но не атом отношения.</p>
<p>В SQL таблицы допускают дубликаты строк (поэтому существует <code>DISTINCT</code>), и ключевое слово <code>ORDER BY</code> задаёт порядок.</p>
`);

add(25,'Единство трёхуровневой структуры реляционной БД',`
<p>В соответствии с ANSI/SPARC БД рассматривается на трёх уровнях, и в РБД между ними существует чёткое соответствие.</p>
<table>
<tr><th>Уровень</th><th>Объекты РБД</th></tr>
<tr><td>Логический (концептуальный)</td><td>реляционное отношение, домен, атрибут, кортеж, потенциальный и внешний ключи</td></tr>
<tr><td>Физический (внутренний)</td><td>файл БД, запись файла, поле записи, индексный файл</td></tr>
<tr><td>Внешний (представлений)</td><td>таблица, строка таблицы, столбец, представление (VIEW)</td></tr>
</table>
<p>Соответствие: <i>отношение ↔ файл ↔ таблица</i>; <i>кортеж ↔ запись ↔ строка</i>; <i>атрибут ↔ поле ↔ столбец</i>.</p>
<p>Например, Null-значение — яркий пример необходимости трёх уровней: на логическом это маркер неопределённости и трёхзначная логика, на физическом — специальный признак в записи, на внешнем — пустая ячейка.</p>
<p>Поиск данных, неупорядоченность кортежей и записей, индексы — вопросы физического уровня; ключи, ссылочная целостность — логического.</p>
`);

add(26,'Потенциальные ключи. Первичные и альтернативные ключи. Примеры',`
<p>Все кортежи отношения уникальны, поэтому уникальные подмножества атрибутов можно использовать для идентификации кортежей.</p>
<div class="def"><b>Потенциальный ключ</b> отношения R — подмножество атрибутов K, обладающее двумя свойствами:
<ol><li><b>уникальность</b> — никакие два кортежа не имеют одинаковых значений K;</li><li><b>неизбыточность</b> — никакое собственное подмножество K не обладает уникальностью.</li></ol></div>
<p>Если потенциальных ключей несколько, один объявляют <b>первичным (PK)</b>, остальные — <b>альтернативными</b>. Если ключ единственный, термины «первичный» и «потенциальный» совпадают.</p>
<h4>Примеры</h4>
<ul>
<li>Student: потенциальный ключ <code>N_z</code> (номер зачётки). Пара (Fam, Name) ключом не является: есть «Ге Николай» с разными N_z.</li>
<li>Человек: ИНН, СНИЛС, номер паспорта, телефон.</li>
</ul>
<pre><code>CREATE TABLE student (
  n_z   CHAR(6) PRIMARY KEY,          -- первичный ключ
  snils CHAR(11) UNIQUE NOT NULL,     -- альтернативный
  fam   VARCHAR(32) NOT NULL,
  name  VARCHAR(16) NOT NULL);</code></pre>
`);

add(27,'Null-значения. Правило целостности сущностей',`
<p>На практике данные бывают неизвестны или неполны. Для этого введён специальный маркер — <b>Null-значение</b>. Это не значение атрибута, а лишь признак того, что значение не определено. Null ≠ 0 и ≠ пустая строка.</p>
<h4>Последствия</h4>
<ul>
<li>Если операнд выражения Null — всё выражение не определено.</li>
<li>Используется <b>трёхзначная логика</b>: Истина — Ложь — Не определено (UNKNOWN).</li>
<li>Сравнение с NULL проверяют только <code>IS NULL</code> / <code>IS NOT NULL</code>.</li>
</ul>
<pre><code>SELECT * FROM customer WHERE fax = NULL;     -- ничего не вернёт
SELECT * FROM customer WHERE fax IS NULL;    -- верно
UPDATE customer SET fax = NULL;</code></pre>
<div class="def"><b>Правило целостности сущностей:</b> атрибуты, входящие в состав потенциального (первичного) ключа, не могут принимать Null-значения — ключ служит основным средством идентификации кортежей.</div>
<p>Для остальных столбцов Null запрещают ограничением <code>NOT NULL</code>.</p>
`);

add(28,'Типы связей между отношениями. Родительские и дочерние отношения',`
<p>Сущности предметной области связаны между собой. Различают четыре типа связей:</p>
<ol>
<li><b>«один-к-одному»</b> (1:1) — избыточна; в РБД считается ошибкой проектирования (одна сущность неправильно разделена на две);</li>
<li><b>«многие-к-одному»</b> (n:1);</li>
<li><b>«один-ко-многим»</b> (1:n);</li>
<li><b>«многие-ко-многим»</b> (n:n) — в РБД напрямую не реализуется: разбивается на две связи 1:n введением промежуточного отношения.</li>
</ol>
<p>Связи 1:n и n:1 симметричны, поэтому реализуется один тип — «один-ко-многим».</p>
<div class="def">Отношение на стороне «один» — <b>родительское</b>; на стороне «много» — <b>дочернее</b>.</div>
<h4>Пример</h4>
<p>Student (родитель) ← Mark (дочернее): один студент имеет много оценок. Subject и Teacher — тоже родители Mark. Связь Student–Subject (n:n) реализована через Mark. Родительские отношения играют роль справочников.</p>
`);

add(29,'Механизм внешних ключей. Ссылочная целостность',`
<p>Чтобы связать дочернее отношение с родительским, в заголовок дочернего достаточно добавить атрибуты, определённые на тех же доменах, что и потенциальный ключ родителя.</p>
<div class="def"><b>Внешний ключ (FK)</b> — подмножество атрибутов дочернего отношения, определённых на тех же доменах, что атрибуты потенциального ключа родительского отношения.</div>
<div class="def"><b>Ссылочная целостность:</b> значения FK всегда должны быть согласованы со значениями PK родителя — для любого значения FK существует соответствующее значение PK.</div>
<h4>Пример (учебная БД)</h4>
<ul>
<li><code>Mark.N</code> → <code>Student.N_z</code> (одинаковый домен, разные имена);</li>
<li><code>Mark.Kod_S</code> → <code>Subject.Kod</code>; <code>Mark.Kod_T</code> → <code>Teacher.Kod</code>.</li>
</ul>
<pre><code>CREATE TABLE mark (
  mark   SMALLINT NOT NULL,
  n      CHAR(6)  NOT NULL REFERENCES student(n_z),
  kod_s  INTEGER  NOT NULL REFERENCES subject(kod),
  kod_t  INTEGER  NOT NULL REFERENCES teacher(kod),
  PRIMARY KEY (n, kod_s));

-- Аналог в Oracle (из лекций):
-- FOREIGN KEY (customerid) REFERENCES customer</code></pre>
<p>Для FK допускается совпадение имён (Kod в Teacher и Subject — разные атрибуты) и различие имён при одном домене (N и N_z).</p>
`);

add(30,'Стратегии поддержания ссылочной целостности',`
<p>Целостность FK нарушается только операциями вставки/редактирования/удаления. Критичны четыре операции: 1) редактирование кортежа родителя; 2) удаление кортежа родителя; 3) вставка кортежа в дочернее; 4) обновление кортежа дочернего. В справочниках (родителях) ничего редактировать и удалять не рекомендуется.</p>
<table>
<tr><th>Стратегия</th><th>Суть</th></tr>
<tr><td><b>RESTRICT</b> (основная)</td><td>Запрещает операцию, нарушающую целостность. Наименее затратная.</td></tr>
<tr><td><b>CASCADE</b> (основная)</td><td>Разрешает операцию и автоматически вносит соответствующие изменения (или удаления) в дочерние отношения.</td></tr>
<tr><td><b>SET NULL</b></td><td>Разрешает операцию, а некорректные FK заменяет на NULL. Столбцы должны допускать NULL; дочерние кортежи теряют связь с родителем.</td></tr>
<tr><td><b>SET DEFAULT</b></td><td>Как SET NULL, но присваивается значение по умолчанию (например, 0).</td></tr>
<tr><td><b>IGNORE</b> (экзотика)</td><td>Не проверяет целостность — ответственность на пользователе; недопустимо.</td></tr>
</table>
<pre><code>CREATE TABLE orders (
  id         NUMERIC(5,0) PRIMARY KEY,
  customerid NUMERIC(5,0) NOT NULL
     REFERENCES customer(id)
     ON DELETE CASCADE
     ON UPDATE RESTRICT);</code></pre>
<p>В PostgreSQL также есть <code>NO ACTION</code> (по умолчанию, проверка в конце оператора), <code>SET NULL</code>, <code>SET DEFAULT</code>.</p>
`);

add(31,'Поиск и доступ к данным БД. Сортировка файлов БД',`
<p>Кортежи отношения не упорядочены, поэтому записи файла БД (ФБД) тоже не упорядочены, и поиск данных сводится к поиску записей в ФБД (физический уровень). Используются два метода: сортировка и индексация.</p>
<h4>Метод сортировки</h4>
<p>Создаётся новый файл, идентичный исходному по содержимому, но с записями, упорядоченными по <b>ключу сортировки</b> (выражение из полей записи, констант, функций, операторов). Далее выполняется эффективный поиск (например, бинарный) по этому ключу.</p>
<h4>Недостатки</h4>
<ul>
<li>огромная ресурсоёмкость;</li>
<li>избыточность: данные дублируются; при смене ключа создаётся новый файл.</li>
</ul>
<p><b>Вывод:</b> метод используется редко — только для файлов-справочников, которые не меняются или меняются редко (пример — КЛАДР.dbf). Основной метод — индексация (вопрос 32).</p>
`);

add(32,'Индексные файлы. Основные типы индексов',`
<p>Идея: использовать специальные рабочие файлы — <b>индексные</b>. Запись простейшего индекса: <code>(&lt;значение индексного ключа&gt;, N)</code>, где N — номер физической записи исходного ФБД. Записи индекса отсортированы по ключу.</p>
<h4>Поиск в два этапа</h4>
<ol><li>В индексном файле ищется значение ключа, запоминаются номера записей N.</li><li>Прямой доступ к записям ФБД по найденным N.</li></ol>
<p>Индексы минимально избыточны, поэтому СУБД может использовать любое их число и переключаться между ними (индексы обычно резидентны в ОП).</p>
<h4>Основные типы индексов</h4>
<table>
<tr><th>Тип</th><th>Описание</th></tr>
<tr><td>Первичный / вторичный</td><td>по ключевому полю (упорядочивающему файл) / по неключевому</td></tr>
<tr><td>Плотный / разреженный</td><td>запись на каждую запись файла / на блок записей</td></tr>
<tr><td>Уникальный</td><td>запрещает дубликаты значений</td></tr>
<tr><td>Составной</td><td>по нескольким полям</td></tr>
<tr><td>B-дерево (B-tree)</td><td>сбалансированное дерево; универсальный, по умолчанию</td></tr>
<tr><td>Хеш-индекс</td><td>только для равенства</td></tr>
<tr><td>Битовый (bitmap)</td><td>для столбцов с малым числом значений</td></tr>
<tr><td>Кластерный</td><td>определяет физический порядок записей</td></tr>
</table>
<pre><code>CREATE INDEX idx_customer_name ON customer (lastname, firstname);
CREATE UNIQUE INDEX idx_student_nz ON student (n_z);</code></pre>
`);

add(33,'Поиск записей в файле БД',`
<p>Способы поиска записи в файле БД:</p>
<ol>
<li><b>Последовательный (полный просмотр)</b> — проверка всех записей, сложность O(n). Единственный вариант без индексов и сортировки.</li>
<li><b>Бинарный поиск</b> по отсортированному файлу, O(log n). Требует метода сортировки.</li>
<li><b>Поиск по индексу</b> — сначала в индексном файле находят значение ключа и номера записей N, затем выполняют прямой доступ к записям ФБД по N. Индексный файл отсортирован, поэтому поиск в нём быстрый.</li>
<li><b>Поиск по B-дереву</b> — иерархический индекс, глубина 3–4 уровня даёт доступ к миллионам записей за несколько обращений к диску.</li>
<li><b>Хеш-поиск</b> — адрес вычисляется по хеш-функции; быстро для равенства, не работает для диапазонов.</li>
</ol>
<p>Пример: поиск студента с <code>N_z = '190118'</code>. Без индекса — просмотр всех записей; с индексом — одна запись индекса и один прямой доступ.</p>
<p>СУБД сама выбирает способ (оптимизатор запросов); пользователь лишь пишет SELECT. Проверить выбор — <code>EXPLAIN</code>.</p>
`);

add(34,'Основы реляционной алгебры. Отношения, совместимые по типу. Примеры',`
<p>Манипуляционная часть РМД реализуется реляционной алгеброй (или эквивалентным реляционным исчислением). Алгебра <b>замкнута</b>: операндами и результатом операции является отношение, поэтому допустимы вложенные выражения любой сложности. Результату присваивают имя в левой части равенства; допускаются неименованные промежуточные отношения.</p>
<div class="def">Отношения A(A1,…,An) и B(B1,…,Bm) <b>совместимы по типу</b>, если для каждого атрибута A существует совпадающий (на том же домене) атрибут B и наоборот. Отсюда n = m (одинаковая степень).</div>
<h4>Пример</h4>
<p>Совместимы: <code>Student2024(N_z, Fam, Name)</code> и <code>Student2025(N_z, Fam, Name)</code>. Несовместимы: <code>Student(N_z, Fam, Name)</code> и <code>Teacher(Kod, FIO)</code> — разная степень и домены.</p>
<p>Совместимость по типу требуется для операций объединения, пересечения, разности. Для любой операции нужно однозначно задать заголовок и тело результата.</p>
`);

add(35,'Основы реляционной алгебры. Операции «Объединение», «Пересечение», «Разность», «Декартово произведение». Примеры',`
<p>Пусть A и B — совместимые по типу отношения.</p>
<table>
<tr><th>Операция</th><th>Обозначение</th><th>Результат</th></tr>
<tr><td>Объединение</td><td>A UNION B, A ∪ B</td><td>кортежи, принадлежащие A, или B, или обоим (дубликаты исключаются)</td></tr>
<tr><td>Пересечение</td><td>A INTERSECT B, A ∩ B</td><td>кортежи, одновременно принадлежащие A и B</td></tr>
<tr><td>Вычитание (разность)</td><td>A MINUS B, A − B</td><td>кортежи A, не принадлежащие B</td></tr>
<tr><td>Декартово произведение</td><td>A TIMES B, A × B</td><td>отношение C(A1..An, B1..Bm) из всех сочетаний кортежей A и B</td></tr>
</table>
<h4>Пример</h4>
<p>A = {Ге, Фет, Ан}, B = {Фет, Репин}. A∪B = {Ге, Фет, Ан, Репин}; A∩B = {Фет}; A−B = {Ге, Ан}.</p>
<p>Декартово произведение: Fam{Ге, Репин, Куинджи} × Name{Николай, Илья, Архип, Саша} = 12 кортежей (Ге Николай, Ге Илья, …). Мощность = |A|·|B|, поэтому при больших отношениях операция может переполнить память. В чистом виде используется редко, но лежит в основе операции соединения.</p>
<pre><code>SELECT * FROM a UNION SELECT * FROM b;
SELECT * FROM a INTERSECT SELECT * FROM b;
SELECT * FROM a EXCEPT SELECT * FROM b;
SELECT * FROM fam CROSS JOIN name;</code></pre>
`);

add(36,'Специальные реляционные операции: «Выборка», «Проекция», «Соединение», «Деление». Примеры',`
<h4>Выборка (WHERE)</h4>
<p>C = A WHERE U — те кортежи A, для которых условие U истинно. «Горизонтальный срез». Пример: студенты с фамилией на «К».</p>
<pre><code>SELECT * FROM student WHERE fam LIKE 'К%';</code></pre>
<h4>Проекция</h4>
<p>C = A[Ai, Aj, …] = П<sub>Ai,Aj,…</sub>(A) — отношение с подмножеством атрибутов; дубликаты кортежей исключаются, поэтому |C| ≤ |A|. «Вертикальный срез». Для Student по {Fam, Name}: 11 кортежей → 9.</p>
<pre><code>SELECT DISTINCT fam, name FROM student;</code></pre>
<h4>Соединение</h4>
<p>C = (A TIMES B) WHERE U — выборка из декартова произведения по условию, использующему атрибуты обоих отношений.</p>
<pre><code>SELECT * FROM student s JOIN mark m ON m.n = s.n_z;</code></pre>
<h4>Деление</h4>
<p>A(A1..An, B1..Bm) ÷ B(B1..Bm) = C(A1..An): кортежи {a1..an}, для которых <b>для каждого</b> кортежа {b} из B существует кортеж {a, b} в A.</p>
<p>Пример: «студенты, сдавшие все предметы из списка B» — A = Mark(N, Kod_S), B = Subject(Kod_S).</p>
<pre><code>SELECT n FROM mark
WHERE kod_s IN (SELECT kod_s FROM b)
GROUP BY n
HAVING COUNT(DISTINCT kod_s) = (SELECT COUNT(*) FROM b);</code></pre>
`);
add(37,'Метод семантического моделирования. Основные положения',`
<p>Информационная система должна описывать актуальное состояние искомой предметной области (ИПО), поэтому модель ИПО должна быть достаточно точной. Это невозможно без анализа и понимания <b>смысловой нагрузки (семантики)</b> объектов ИПО. Например, для библиотеки главное в книге — ISBN, название, авторы, инвентарный номер.</p>
<div class="def"><b>Семантическое моделирование РБД</b> — математическое моделирование структур данных, опирающееся на семантику объектов ИПО: проектирование выполняется исходя из смысловой нагрузки объектов.</div>
<h4>Особенности метода (МСМ)</h4>
<ul>
<li><b>Слабо формализован</b>; инструмент — ER-диаграммы (сущность–связь, Entity-Relationship).</li>
<li><b>Итерационный</b> (пошаговый): на каждом шаге модель уточняется и исправляется.</li>
<li>Строится метод последовательных уточнений исходных диаграмм.</li>
<li>Реальный инструмент моделирования данных — именно МСМ, а не формальная нормализация отношений.</li>
</ul>
<h4>Что нужно получить из анализа ИПО</h4>
<ol><li>полный список сущностей;</li><li>полный список атрибутов каждой сущности;</li><li>описание связей между сущностями.</li></ol>
<p>Приём: выделить все имена существительные в описании функций системы и проанализировать каждое — сущность это, атрибут или абстракция.</p>
`);

add(38,'Модели ER-диаграмм. Нотация П. Чена, IDEF1x, нотация Мартина',`
<p>Графические обозначения, используемые в ER-диаграммах, называются <b>нотацией</b>. Основные нотации: П. Чена (1976/77), Мартина (crow's foot, «вороньи лапки»), IDEF1X, Баркера.</p>
<table>
<tr><th>Нотация</th><th>Сущность</th><th>Атрибуты</th><th>Связь</th></tr>
<tr><td><b>Чена</b></td><td>прямоугольник</td><td>овалы, соединённые линиями с сущностью (ключ подчёркнут)</td><td>ромб с именем связи; на линиях указывается кардинальность 1, n, m</td></tr>
<tr><td><b>Мартина</b></td><td>прямоугольник с атрибутами внутри</td><td>внутри прямоугольника, ключ подчёркнут</td><td>линия; сторона «много» — «вороньи лапки», «один» — черта; «может» — пунктир, «должен» — сплошная</td></tr>
<tr><td><b>IDEF1X</b></td><td>независимая — прямоугольник с острыми углами; зависимая — со скруглёнными</td><td>внутри: над чертой ключ, под чертой остальные</td><td>идентифицирующая — сплошная линия; неидентифицирующая — пунктир; точка на стороне «много»</td></tr>
</table>
<p>Тип связи: 1:1, 1:n, n:n. Связь 1:1 — ошибка проектирования, n:n допустима лишь на ранних этапах и заменяется двумя связями 1:n через промежуточную сущность.</p>
<p>Нотацию Баркера также нужно знать; при ответе допускается «шпаргалка».</p>
`);

add(39,'Основные определения и обозначения семантического моделирования',`
<ol>
<li><b>Сущность</b> — класс однотипных объектов, информация о которых должна быть учтена в модели. Имя — существительное в единственном числе, именительном падеже. Обозначается прямоугольником. Сущности превращаются в реляционные отношения.</li>
<li><b>Экземпляр сущности</b> — конкретный представитель; все экземпляры различимы (книга и её ISBN).</li>
<li><b>Атрибут</b> — именованная характеристика сущности. Имя уникально в пределах сущности. Размещается внутри прямоугольника. Атрибут скалярен; «список товаров» атрибутом быть не может — это новая сущность.</li>
<li><b>Ключ сущности</b> — неизбыточный набор атрибутов, значения которых уникальны для каждого экземпляра. Подчёркивается сплошной линией. Ключей может быть несколько.</li>
<li><b>Связь</b> — ассоциация между двумя сущностями (или сущности с самой собой), имеющая имя и семантику. Типы: 1:1, 1:n, n:n.</li>
<li><b>Модальность связи</b> — «может» (пунктирная линия: экземпляр может не иметь связанных) и «должен» (сплошная: обязан иметь хотя бы один). На разных концах связи модальность может различаться.</li>
</ol>
<p>В связи 1:n сущность на стороне «один» — родительская, «много» — дочерняя.</p>
<div class="note">В ER-диаграммах, в отличие от РМД, нет механизма внешних ключей: атрибуты-внешние ключи появляются только в физической модели.</div>
`);

add(40,'Шаблон «чтения» ER-диаграмм',`
<p>Графический синтаксис ER-диаграмм, несмотря на слабую формализацию, позволяет однозначно читать диаграмму по шаблону:</p>
<div class="def">&lt;Каждый экземпляр сущности 1&gt; &lt;модальность&gt; &lt;наименование связи&gt; &lt;тип связи&gt; &lt;экземпляр сущности 2&gt;</div>
<p>Модальность: «может» (пунктир) или «должен» (сплошная); тип связи: «один» или «несколько».</p>
<h4>Пример: «Сотрудник» — «Ребёнок»</h4>
<ol>
<li>Каждый сотрудник <b>может</b> иметь <b>несколько</b> детей.</li>
<li>Каждый ребёнок <b>должен</b> принадлежать <b>ровно одному</b> сотруднику.</li>
</ol>
<h4>Пример: «Накладная» — «СТН» (список товаров накладной)</h4>
<ol>
<li>Каждая накладная должна иметь хотя бы одну запись в СТН.</li>
<li>Каждая запись СТН должна входить ровно в одну накладную.</li>
</ol>
<p>Читается в обе стороны — отдельная фраза для каждого конца связи.</p>
`);

add(41,'Пример построения ER-модели',`
<p>ИПО — оптовая торговая фирма. Модель строится итерационно, за четыре этапа.</p>
<h4>Этап 1. Функции</h4>
<p>Хранить сведения о покупателях, печатать накладные, отслеживать наличие товаров на складе. Существительные: <b>покупатель</b>, <b>товар</b> — сущности; «склад» — пока вопрос; «наличие товара» — скорее атрибут.</p>
<h4>Этап 2. Уточнение</h4>
<p>Несколько складов; товар может храниться на нескольких складах. Покупатель выписывает несколько накладных; накладная — на одного покупателя, содержит хотя бы один товар, выписывается с определённого склада. Появляются сущности <b>накладная</b> и <b>склад</b>.</p>
<h4>Этап 3. Атрибуты</h4>
<ul>
<li>Покупатель: наименование, адрес, банковские реквизиты.</li>
<li>Товар: наименование, цена, единица измерения.</li>
<li>Накладная: номер (ключ), дата, общая сумма.</li>
<li>Склад: наименование.</li>
</ul>
<h4>Этап 4. Устранение связей n:n</h4>
<p>Цена товара в накладных различна и отличается от текущей. Накладная–Товар (n:n) → новая сущность <b>СТН</b> (список товаров накладной) с атрибутами «количество» и «цена в накладной». Товар–Склад (n:n) → <b>Товар на складе</b> с атрибутом «количество на складе».</p>
<pre><code>Покупатель 1──&lt; Накладная 1──&lt; СТН &gt;──1 Товар
                  &gt;──1 Склад    Товар 1──&lt; Товар на складе &gt;──1 Склад</code></pre>
`);

add(42,'Физическая ER-модель',`
<p>ER-диаграмма этапа 4 — <b>логическая (концептуальная)</b> модель: она не учитывает конкретную СУБД. Следующий шаг — выбрать тип модели БД (реляционная) и среду реализации (конкретная СУБД). Концептуальная модель одна, физических — много.</p>
<h4>Преобразование в физическую модель</h4>
<ul>
<li>каждая сущность → реляционное отношение (таблица);</li>
<li>каждый атрибут → столбец с допустимым в СУБД типом и именем;</li>
<li>связи реализуются <b>миграцией ключевых атрибутов</b> родителя в дочернее отношение — так создаются <b>внешние ключи</b> (например, в таблицах «Список товаров в накладной» и «Товар на складе» появляются ключи родителей);</li>
<li>задаются первичные ключи, ограничения NOT NULL, CHECK, UNIQUE, индексы, стратегии ссылочной целостности.</li>
</ul>
<h4>Пример (фрагмент)</h4>
<pre><code>CREATE TABLE customer (id INTEGER PRIMARY KEY, name VARCHAR(100) NOT NULL,
                       address VARCHAR(200), bank_details VARCHAR(200));
CREATE TABLE invoice (id INTEGER PRIMARY KEY, inv_date DATE NOT NULL,
                      customer_id INTEGER NOT NULL REFERENCES customer(id),
                      warehouse_id INTEGER NOT NULL REFERENCES warehouse(id));
CREATE TABLE invoice_item (invoice_id INTEGER REFERENCES invoice(id),
                           product_id INTEGER REFERENCES product(id),
                           quantity NUMERIC(8,2), price NUMERIC(10,2),
                           PRIMARY KEY (invoice_id, product_id));</code></pre>
`);

add(43,'Основные понятия SQL. Хронология стандартов SQL',`
<p><b>SQL (Structured Query Language)</b> — декларативный язык структурированных запросов к реляционным БД. Пользователь описывает, что нужно получить, а СУБД транслирует команды во внутренние процедуры. SQL скрывает детали обработки данных, поэтому прост в использовании. Стандартизован ANSI (американский институт) и ISO (международная организация); каждая СУБД реализует стандарт с расширениями (диалекты).</p>
<h4>Хронология</h4>
<table>
<tr><th>Год</th><th>Событие</th></tr>
<tr><td>1970</td><td>Э. Кодд публикует реляционную модель</td></tr>
<tr><td>1974–77</td><td>IBM, проект System R: язык SEQUEL → SQL</td></tr>
<tr><td>1979</td><td>первая коммерческая СУБД с SQL — Oracle</td></tr>
<tr><td>1986</td><td>SQL-86 (SQL-87) — первый стандарт ANSI/ISO</td></tr>
<tr><td>1989</td><td>SQL-89 — ограничения целостности</td></tr>
<tr><td>1992</td><td>SQL-92 (SQL2) — основа современных СУБД: JOIN, CASE, CAST, типы дат</td></tr>
<tr><td>1999</td><td>SQL:1999 (SQL3) — триггеры, рекурсия, объектные расширения</td></tr>
<tr><td>2003</td><td>SQL:2003 — XML, оконные функции, последовательности</td></tr>
<tr><td>2006, 2008, 2011</td><td>SQL:2006, SQL:2008, SQL:2011 (темпоральные данные)</td></tr>
<tr><td>2016, 2023</td><td>SQL:2016 (JSON), SQL:2023 (property graph queries)</td></tr>
</table>
<p>Oracle7 был полностью совместим с минимальным стандартом ANSI/ISO SQL-92. Диалект PostgreSQL ближе всего к стандарту.</p>
`);

add(44,'Типы команд SQL',`
<table>
<tr><th>Группа</th><th>Название</th><th>Команды</th><th>Назначение</th></tr>
<tr><td><b>DDL</b></td><td>Data Definition Language — определение данных</td><td>CREATE, ALTER, DROP, TRUNCATE</td><td>создание, изменение, удаление объектов БД (таблиц, представлений, индексов, процедур, триггеров, пользователей, ролей)</td></tr>
<tr><td><b>DML</b></td><td>Data Manipulation Language — манипулирование данными</td><td>INSERT, UPDATE, DELETE</td><td>вставка, изменение, удаление строк</td></tr>
<tr><td><b>DSL / DQL</b></td><td>выборка данных</td><td>SELECT</td><td>получение данных (часто относят к DML)</td></tr>
<tr><td><b>DCL</b></td><td>Data Control Language — управление данными</td><td>GRANT, REVOKE, SET ROLE</td><td>предоставление и отмена привилегий и ролей</td></tr>
<tr><td><b>DTL / TCL</b></td><td>Data/Transaction Control Language — управление транзакциями</td><td>COMMIT, ROLLBACK, SAVEPOINT, SET TRANSACTION</td><td>фиксация и откат транзакций</td></tr>
</table>
<p>Каждая из групп подробно рассмотрена в следующих вопросах.</p>
`);

add(45,'Язык определения данных DDL',`
<p>Команды DDL создают, изменяют и удаляют объекты базы данных: таблицы, представления, процедуры, триггеры, индексы, пользователей, роли, табличные пространства. Большинство объектов поддерживает команды <b>CREATE</b>, <b>ALTER</b> и <b>DROP</b>. Привилегии DDL: <code>CREATE TABLE</code>, <code>CREATE VIEW</code>, <code>CREATE PROCEDURE</code>, <code>CREATE TRIGGER</code>, <code>CREATE USER</code>, <code>CREATE ROLE</code>.</p>
<pre><code>CREATE TABLE teacher (kod INTEGER PRIMARY KEY, fio VARCHAR(60) NOT NULL);

ALTER TABLE teacher ADD COLUMN phone VARCHAR(20);
ALTER TABLE teacher DROP COLUMN phone;
ALTER TABLE teacher ALTER COLUMN fio TYPE VARCHAR(100);
ALTER TABLE teacher RENAME TO lecturer;

CREATE VIEW v_teacher AS SELECT kod, fio FROM lecturer;
CREATE INDEX idx_fio ON lecturer (fio);
TRUNCATE TABLE mark;          -- быстро очищает таблицу
DROP TABLE lecturer CASCADE;  -- удаляет таблицу и зависимые объекты</code></pre>
<p>Особенность: заголовок отношения статичен, поэтому ALTER TABLE — редкая, ответственная операция. Команды DDL в PostgreSQL транзакционны.</p>
`);

add(46,'Создание объекта «таблица». Формальное описание. Примеры',`
<h4>Упрощённый формальный синтаксис</h4>
<pre><code>CREATE [ TEMPORARY ] TABLE [ IF NOT EXISTS ] имя_таблицы (
   имя_столбца тип_данных [ DEFAULT выражение ] [ ограничение_столбца [ ... ] ]
   [, ... ]
   [, ограничение_таблицы [, ... ] ]
);

ограничение_столбца:
   NOT NULL | NULL | UNIQUE | PRIMARY KEY
 | CHECK (выражение)
 | REFERENCES таблица [(столбец)] [ON DELETE действие] [ON UPDATE действие]

ограничение_таблицы:
   [CONSTRAINT имя] PRIMARY KEY (столбцы) | UNIQUE (столбцы)
 | CHECK (выражение) | FOREIGN KEY (столбцы) REFERENCES таблица (столбцы)</code></pre>
<h4>Пример (из лекций, адаптированный под PostgreSQL)</h4>
<pre><code>CREATE TABLE customer (
  id        NUMERIC(5,0) PRIMARY KEY,
  lastname  VARCHAR(50) NOT NULL,
  firstname VARCHAR(50) NOT NULL,
  address   VARCHAR(100),
  city      VARCHAR(50),
  state     CHAR(2) CHECK (state IN ('AL','AK','AZ','CA','NY','TX')),
  zipcode   VARCHAR(10),
  phone     VARCHAR(20),
  fax       VARCHAR(20),
  UNIQUE (lastname, firstname));

CREATE TABLE stock (
  id        NUMERIC(5,0) PRIMARY KEY,
  unitprice NUMERIC(10,2) NOT NULL,
  onhand    NUMERIC(5,0),
  reorder   NUMERIC(5,0),
  description VARCHAR(2000));

CREATE TABLE orders (
  id         NUMERIC(5,0) PRIMARY KEY,
  customerid NUMERIC(5,0) NOT NULL REFERENCES customer(id) ON DELETE CASCADE,
  orderdate  DATE NOT NULL,
  shipdate   DATE,
  paiddate   DATE,
  status     CHAR(1) CHECK (status IN ('F','B')),   -- F — оплачено, B — долг
  total      NUMERIC(10,2));

CREATE TABLE item (
  id        NUMERIC(5,0) PRIMARY KEY,
  orderid   NUMERIC(5,0) NOT NULL REFERENCES orders(id),
  stockid   NUMERIC(5,0) NOT NULL REFERENCES stock(id),
  quantity  NUMERIC(5,0) NOT NULL,
  total     NUMERIC(10,2));</code></pre>
<p>Ограничения целостности: PRIMARY KEY (целостность сущностей), FOREIGN KEY/REFERENCES (ссылочная целостность), NOT NULL, UNIQUE, CHECK (сужение домена).</p>
`);
add(47,'Типы данных SQL. Строчный тип',`
<p>Строковые типы хранят текст. Стандарт SQL и PostgreSQL:</p>
<table>
<tr><th>Тип</th><th>Описание</th></tr>
<tr><td><code>CHAR(n)</code>, <code>CHARACTER(n)</code></td><td>строка фиксированной длины n, дополняется пробелами справа (например, <code>state CHAR(2)</code>, номер зачётки <code>CHAR(6)</code>)</td></tr>
<tr><td><code>VARCHAR(n)</code>, <code>CHARACTER VARYING(n)</code></td><td>строка переменной длины не более n символов (в Oracle — VARCHAR2)</td></tr>
<tr><td><code>TEXT</code></td><td>строка неограниченной длины (расширение PostgreSQL)</td></tr>
</table>
<p>Литералы пишут в одинарных кавычках: <code>'Иванов'</code>; кавычка внутри удваивается: <code>'O''Brien'</code>. Операции: конкатенация <code>||</code> (или <code>CONCAT</code>), сравнение, <code>LIKE</code> (шаблоны <code>%</code> и <code>_</code>).</p>
<pre><code>CREATE TABLE person (code CHAR(6), fam VARCHAR(32), note TEXT);
SELECT fam || ' ' || LEFT(name,1) || '.' AS fio FROM student;
SELECT * FROM customer WHERE lastname LIKE 'К%';</code></pre>
<p>С точки зрения реляционной модели строка — простой тип, над ней допустимы операции как над единым целым.</p>
`);

add(48,'Типы данных SQL. Числовой тип',`
<table>
<tr><th>Группа</th><th>Типы</th><th>Комментарий</th></tr>
<tr><td>Целые</td><td><code>SMALLINT</code> (2 байта), <code>INTEGER/INT</code> (4), <code>BIGINT</code> (8)</td><td>точные</td></tr>
<tr><td>Точные с фиксированной точкой</td><td><code>NUMERIC(p,s)</code>, <code>DECIMAL(p,s)</code></td><td>p — общее число цифр, s — число цифр после запятой; для денег и ключей. <code>NUMERIC(10,2)</code> — до 8 цифр до запятой и 2 после</td></tr>
<tr><td>Приближённые (с плавающей точкой)</td><td><code>REAL</code>, <code>DOUBLE PRECISION</code>, <code>FLOAT</code></td><td>возможна погрешность округления</td></tr>
<tr><td>Автоинкремент</td><td><code>SERIAL</code>, <code>BIGSERIAL</code>, <code>GENERATED ... AS IDENTITY</code></td><td>для суррогатных ключей</td></tr>
</table>
<p>Операции: <code>+ - * / %</code>, функции <code>ABS, ROUND, SQRT</code>. Целочисленное деление: <code>7/2 = 3</code>.</p>
<pre><code>CREATE TABLE stock (
  id        SERIAL PRIMARY KEY,
  unitprice NUMERIC(10,2) NOT NULL,
  onhand    INTEGER,
  rating    REAL);</code></pre>
<p>В лекциях (Oracle) использовался NUMBER(p,s); в PostgreSQL его аналог — NUMERIC.</p>
`);

add(49,'Типы данных SQL. Тип данных «Дата» и «Время»',`
<table>
<tr><th>Тип</th><th>Содержимое</th><th>Пример литерала</th></tr>
<tr><td><code>DATE</code></td><td>календарная дата</td><td><code>DATE '2026-11-25'</code></td></tr>
<tr><td><code>TIME [WITH TIME ZONE]</code></td><td>время суток</td><td><code>'14:30:00'</code></td></tr>
<tr><td><code>TIMESTAMP [WITH TIME ZONE]</code> (timestamptz)</td><td>дата и время</td><td><code>'2026-11-25 14:30:00'</code></td></tr>
<tr><td><code>INTERVAL</code></td><td>промежуток времени</td><td><code>INTERVAL '3 days'</code></td></tr>
</table>
<p>Арифметика: дата ± интервал, разность дат — число дней.</p>
<pre><code>SELECT CURRENT_DATE, CURRENT_TIMESTAMP, NOW();
SELECT CURRENT_DATE + INTERVAL '7 days';
SELECT '2026-12-31'::date - CURRENT_DATE AS days_left;
SELECT EXTRACT(YEAR FROM orderdate) FROM orders;
INSERT INTO orders (id, customerid, orderdate, status)
VALUES (239, 2, '1993-06-06', 'F');</code></pre>
<p>В Oracle (лекции) дата хранится в типе DATE и включает время; текущую дату возвращает <code>SYSDATE</code>, в PostgreSQL — <code>CURRENT_DATE</code> / <code>NOW()</code>.</p>
`);

add(50,'Типы данных SQL. Тип данных NULL',`
<p>NULL — не тип в строгом смысле, а <b>маркер отсутствия значения</b> (неизвестно или неприменимо), допустимый для столбца любого типа, если нет ограничения NOT NULL (или PRIMARY KEY).</p>
<h4>Свойства</h4>
<ul>
<li>NULL ≠ 0, NULL ≠ '' (пустая строка), NULL ≠ NULL.</li>
<li>Любое арифметическое выражение с NULL даёт NULL.</li>
<li><b>Трёхзначная логика</b>: TRUE / FALSE / UNKNOWN. <code>NULL = NULL</code> → UNKNOWN. WHERE пропускает строки только при TRUE.</li>
<li>Проверка: <code>IS NULL</code>, <code>IS NOT NULL</code>, <code>IS DISTINCT FROM</code>.</li>
<li>Агрегатные функции (кроме <code>COUNT(*)</code>) игнорируют NULL.</li>
<li>В ORDER BY: по умолчанию NULL считается наибольшим значением (<code>NULLS FIRST/LAST</code>).</li>
</ul>
<pre><code>SELECT id FROM customer WHERE address IS NULL OR city IS NULL;
SELECT COALESCE(address, 'NONE AVAILABLE') AS address FROM customer;  -- в Oracle: NVL
SELECT NULLIF(onhand, 0) FROM stock;
UPDATE customer SET fax = NULL;</code></pre>
<p>Для атрибутов потенциальных ключей NULL запрещён (правило целостности сущностей).</p>
`);

add(51,'DSL. Команда SELECT. Формальное описание. Примеры',`
<p>Команда SELECT считывает информацию из БД — результирующий набор (результат запроса).</p>
<h4>Формальное описание (упрощённо)</h4>
<pre><code>SELECT [ ALL | DISTINCT ] список_выбора
[ FROM источник [, ...] ]
[ WHERE условие ]
[ GROUP BY выражения ]
[ HAVING условие ]
[ { UNION | INTERSECT | EXCEPT } [ALL] другой_select ]
[ ORDER BY выражение [ASC | DESC] [, ...] ]
[ LIMIT n ] [ OFFSET m ];</code></pre>
<p>Порядок выполнения: FROM → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT.</p>
<h4>Примеры (БД customer/orders/item/stock)</h4>
<pre><code>SELECT * FROM customer;                              -- все столбцы
SELECT id, lastname, firstname FROM customer WHERE id = 32;
SELECT DISTINCT state FROM customer;
SELECT lastname || ', ' || firstname AS name FROM customer;  -- псевдоним столбца
SELECT lastname, firstname FROM customer ORDER BY lastname, firstname;
SELECT c.lastname, o.orderdate
FROM customer c JOIN orders o ON o.customerid = c.id
WHERE o.orderdate &gt;= DATE '1993-06-01';</code></pre>
<p>«Звёздочка» <code>*</code> — все столбцы. Если таблицы разных схем/пользователей имеют одинаковые имена, перед именем ставят префикс схемы: <code>gwashington.customer</code>.</p>
`);

add(52,'Команда SELECT. Операторы сравнения. Примеры',`
<table>
<tr><th>Оператор</th><th>Смысл</th><th>Пример</th></tr>
<tr><td><code>= &lt;&gt; != &lt; &gt; &lt;= &gt;=</code></td><td>простые сравнения</td><td><code>WHERE id = 32</code></td></tr>
<tr><td><code>BETWEEN a AND b</code></td><td>значение в диапазоне (включая границы)</td><td><code>WHERE orderdate BETWEEN '1993-06-01' AND '1993-06-30'</code></td></tr>
<tr><td><code>IN (список)</code></td><td>значение входит в список или подзапрос</td><td><code>WHERE state IN ('CA','FL','AZ')</code></td></tr>
<tr><td><code>LIKE</code></td><td>шаблон (<code>%</code> — любая цепочка, <code>_</code> — один символ)</td><td><code>WHERE lastname LIKE 'К%'</code></td></tr>
<tr><td><code>IS NULL / IS NOT NULL</code></td><td>проверка на NULL</td><td><code>WHERE city IS NULL</code></td></tr>
<tr><td><code>ANY / SOME / ALL</code></td><td>сравнение с набором значений подзапроса</td><td><code>WHERE price &gt; ALL (SELECT ...)</code></td></tr>
<tr><td><code>EXISTS</code></td><td>подзапрос возвращает хотя бы одну строку</td><td><code>WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customerid = c.id)</code></td></tr>
</table>
<p>Логические связки: <code>AND</code>, <code>OR</code>, <code>NOT</code>. Для сложных условий используют скобки. Пример из лекций: условие <code>(address IS NULL) OR (city IS NULL)</code> возвращает строку, если выполнено хотя бы одно; при <code>AND</code> — оба.</p>
<pre><code>SELECT id, lastname FROM customer
WHERE id NOT IN (SELECT customerid FROM orders);   -- покупатели без заказов</code></pre>
<div class="note">Осторожно: <code>NOT IN</code> с подзапросом, содержащим NULL, не вернёт ни одной строки — используйте <code>NOT EXISTS</code>.</div>
`);

add(53,'Команда SELECT. Предложение GROUP BY. Примеры',`
<p><b>GROUP BY</b> разбивает строки на группы с одинаковыми значениями указанных столбцов; к каждой группе применяются агрегатные функции (COUNT, SUM, AVG, MIN, MAX), результат — одна строка на группу.</p>
<p>Правило: в списке SELECT допустимы только столбцы из GROUP BY и агрегатные функции.</p>
<pre><code>-- число покупателей в каждом штате
SELECT state, COUNT(*) AS cnt
FROM customer
GROUP BY state;

-- сумма и количество заказов каждого покупателя
SELECT customerid, COUNT(*) AS orders_cnt, SUM(total) AS sum_total
FROM orders
GROUP BY customerid;

-- общая сумма заказа 32 (из лекций)
SELECT SUM(quantity * unitprice)
FROM item, stock
WHERE orderid = 32 AND item.stockid = stock.id;</code></pre>
<p>Группировка по нескольким столбцам: <code>GROUP BY state, city</code>. NULL образуют отдельную группу. Фильтрация групп — через HAVING (вопрос 54), строк до группировки — WHERE.</p>
`);

add(54,'Команда SELECT. Предложение HAVING. Примеры',`
<p><b>HAVING</b> фильтрует <i>группы</i> после GROUP BY — по значениям агрегатных функций. WHERE работает до группировки и не может содержать агрегатов.</p>
<table><tr><th>WHERE</th><th>HAVING</th></tr>
<tr><td>фильтрует строки</td><td>фильтрует группы</td></tr>
<tr><td>выполняется до GROUP BY</td><td>после GROUP BY</td></tr>
<tr><td>без агрегатных функций</td><td>с агрегатными функциями</td></tr></table>
<pre><code>-- штаты, где больше 5 покупателей
SELECT state, COUNT(*) FROM customer
GROUP BY state
HAVING COUNT(*) &gt; 5;

-- покупатели с общей суммой заказов &gt; 10000, заказы после 2020 года
SELECT customerid, SUM(total) AS s
FROM orders
WHERE orderdate &gt;= '2020-01-01'
GROUP BY customerid
HAVING SUM(total) &gt; 10000
ORDER BY s DESC;</code></pre>
`);

add(55,'Команда SELECT. Упорядочивание результирующего набора. Примеры',`
<p>Результат запроса — реляционное отношение, строки которого не упорядочены. Порядок задаёт предложение <b>ORDER BY</b> (всегда последнее в запросе).</p>
<pre><code>SELECT id, lastname, firstname FROM customer ORDER BY lastname, firstname;
SELECT * FROM orders ORDER BY orderdate DESC;           -- по убыванию
SELECT lastname FROM customer ORDER BY 1;               -- по номеру столбца
SELECT lastname, firstname FROM customer
ORDER BY CONCAT(lastname, firstname);                   -- по выражению
SELECT * FROM stock ORDER BY onhand DESC NULLS LAST;
SELECT * FROM orders ORDER BY orderdate DESC LIMIT 10 OFFSET 20;</code></pre>
<ul>
<li><code>ASC</code> — по возрастанию (по умолчанию), <code>DESC</code> — по убыванию.</li>
<li>Можно указать несколько ключей: следующий действует внутри совпавших значений предыдущего.</li>
<li>В ORDER BY разрешены псевдонимы столбцов SELECT.</li>
</ul>
<p>Это и есть «ключ сортировки» из теории — произвольное выражение над полями записи.</p>
`);

add(56,'Команда SELECT. Создание таблиц по образцу. Примеры',`
<p>Результат SELECT можно сохранить в новую таблицу или скопировать структуру существующей.</p>
<pre><code>-- 1. Создание и заполнение результатом запроса
CREATE TABLE orderhistory AS
SELECT * FROM orders WHERE orderdate &lt; '1993-05-31';

-- 2. Только структура (без строк)
CREATE TABLE orders_copy AS SELECT * FROM orders WITH NO DATA;

-- 3. Копирование структуры, включая ограничения и индексы
CREATE TABLE orders_copy2 (LIKE orders INCLUDING ALL);

-- 4. Альтернативный синтаксис PostgreSQL/SQL Server
SELECT id, lastname INTO TEMP TABLE tmp_customer FROM customer;

-- 5. Копирование строк в существующую таблицу
INSERT INTO orderhistory SELECT * FROM orders WHERE orderdate &lt; '1993-05-31';</code></pre>
<p>Примечание: <code>CREATE TABLE AS</code> не переносит первичные и внешние ключи — их нужно добавить командой <code>ALTER TABLE</code>. Типы столбцов определяются выражениями SELECT.</p>
`);

add(57,'Команда SELECT. Перекрёстное соединение (CROSS JOIN). Примеры',`
<p><b>CROSS JOIN</b> — декартово произведение: каждая строка левой таблицы сочетается с каждой строкой правой. Результат содержит |A|·|B| строк, условие соединения отсутствует.</p>
<pre><code>SELECT f.fam, n.name
FROM fam f CROSS JOIN name n;           -- 3 × 4 = 12 строк

-- эквивалентная старая запись
SELECT f.fam, n.name FROM fam f, name n;</code></pre>
<p>Если добавить условие WHERE, получится соединение: <code>(A TIMES B) WHERE U</code>. Старый стиль <code>FROM a, b WHERE a.id = b.aid</code> — то же, что внутреннее соединение:</p>
<pre><code>SELECT * FROM student s, mark m WHERE s.n_z = m.n;
SELECT * FROM student s INNER JOIN mark m ON s.n_z = m.n;</code></pre>
<p><b>Применение:</b> генерация всех комбинаций (размер × цвет), календарные сетки, тестовые данные. <b>Риск:</b> на больших таблицах (десятки тысяч × миллионы) приводит к переполнению памяти и резкому замедлению.</p>
`);

add(58,'Команда SELECT. Внешние соединения. Примеры',`
<p>Внутреннее соединение (<code>INNER JOIN</code>) возвращает только пары с совпадением по условию; несовпавшие строки теряются. <b>Внешние соединения</b> сохраняют строки одной или обеих таблиц; недостающие значения заполняются NULL.</p>
<table>
<tr><th>Вид</th><th>Сохраняет</th></tr>
<tr><td><code>LEFT [OUTER] JOIN</code></td><td>все строки левой таблицы</td></tr>
<tr><td><code>RIGHT [OUTER] JOIN</code></td><td>все строки правой таблицы</td></tr>
<tr><td><code>FULL [OUTER] JOIN</code></td><td>все строки обеих таблиц</td></tr>
</table>
<pre><code>-- все студенты, в том числе без оценок
SELECT s.fam, s.name, m.mark
FROM student s LEFT JOIN mark m ON m.n = s.n_z;

-- студенты, у которых вообще нет оценок
SELECT s.fam FROM student s
LEFT JOIN mark m ON m.n = s.n_z
WHERE m.n IS NULL;

-- покупатели и их заказы (включая покупателей без заказов)
SELECT c.lastname, o.id, o.orderdate
FROM customer c LEFT JOIN orders o ON o.customerid = c.id;

SELECT * FROM a FULL JOIN b ON a.id = b.id;</code></pre>
<p>Старый синтаксис Oracle: <code>WHERE a.id = b.id(+)</code>. Пример данных: в таблице Mark есть оценка с неизвестным преподавателем («Значение неизвестно») — для таких случаев удобны внешние соединения.</p>
`);

add(59,'Команда SELECT. Объединение запросов. Примеры',`
<p>Результаты нескольких SELECT объединяют теоретико-множественными операциями. Запросы должны быть <b>совместимы по типу</b>: одинаковое число столбцов и совместимые типы.</p>
<table>
<tr><th>Оператор</th><th>Результат</th></tr>
<tr><td><code>UNION</code></td><td>объединение без дубликатов</td></tr>
<tr><td><code>UNION ALL</code></td><td>объединение с дубликатами (быстрее)</td></tr>
<tr><td><code>INTERSECT</code></td><td>пересечение</td></tr>
<tr><td><code>EXCEPT</code> (в Oracle — <code>MINUS</code>)</td><td>разность</td></tr>
</table>
<pre><code>-- ФИО всех: и студентов, и преподавателей
SELECT fam AS name FROM student
UNION
SELECT fio FROM teacher;

-- города, где есть и покупатели, и поставщики
SELECT city FROM customer
INTERSECT
SELECT city FROM supplier;

-- покупатели без заказов
SELECT id FROM customer
EXCEPT
SELECT customerid FROM orders
ORDER BY 1;</code></pre>
<p>Имена столбцов результата берутся из первого запроса; ORDER BY указывается один раз в конце.</p>
`);

add(60,'Команда SELECT. Подзапросы. Примеры',`
<p><b>Подзапрос</b> — SELECT, вложенный в другой запрос (в скобках). Может находиться в WHERE, HAVING, FROM, списке SELECT и в командах INSERT/UPDATE/DELETE.</p>
<h4>Виды</h4>
<ul>
<li><b>Скалярный</b> — одно значение;</li>
<li><b>Строковый/табличный</b> — несколько значений или строк (используется с IN, ANY, ALL, EXISTS);</li>
<li><b>Коррелированный</b> — ссылается на столбцы внешнего запроса, выполняется для каждой его строки.</li>
</ul>
<pre><code>-- Скалярный: товары дороже среднего
SELECT id, description FROM stock
WHERE unitprice &gt; (SELECT AVG(unitprice) FROM stock);

-- IN: покупатели, у которых есть заказы
SELECT lastname, firstname FROM customer
WHERE id IN (SELECT customerid FROM orders);

-- NOT IN (пример из лекций): покупатели без заказов
SELECT lastname, firstname FROM customer
WHERE id NOT IN (SELECT customerid FROM orders);

-- Коррелированный EXISTS
SELECT c.lastname FROM customer c
WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customerid = c.id);

-- Подзапрос в FROM
SELECT t.customerid, t.s FROM
  (SELECT customerid, SUM(total) AS s FROM orders GROUP BY customerid) t
WHERE t.s &gt; 1000;

-- Подзапрос в UPDATE (из лекций)
UPDATE orders SET customerid =
  (SELECT id FROM customer WHERE lastname = 'King' AND firstname = 'Martin')
WHERE id = 562;</code></pre>
`);

add(61,'Операторы DML. Команда INSERT. Примеры',`
<p><b>INSERT</b> добавляет новые строки (кортежи) в таблицу.</p>
<pre><code>INSERT INTO таблица [ (столбцы) ]
{ VALUES (значения) [, (значения) ...] | SELECT ... }
[ RETURNING выражения ];</code></pre>
<ul>
<li>Предложение <code>INTO</code> указывает таблицу и необязательный список столбцов; <code>VALUES</code> задаёт значения для новой строки.</li>
<li>Если список столбцов опущен, значения задаются для всех столбцов в порядке определения.</li>
<li>Незаданные столбцы получают DEFAULT или NULL.</li>
</ul>
<pre><code>INSERT INTO orders VALUES (239, 2, '1993-06-06', '1993-06-23', NULL, 'F');

INSERT INTO orders (id, customerid, orderdate, status)
VALUES (270, 7, '1993-06-06', 'B');

-- несколько строк
INSERT INTO teacher (kod, fio) VALUES (5, 'Тропкина Е.А.'), (14, 'Рудман Р.М.');

-- копирование строк из другой таблицы (из лекций)
INSERT INTO orderhistory SELECT * FROM orders WHERE orderdate &lt; '1993-05-31';

-- текущая дата и пользователь
INSERT INTO orders (id, customerid, orderdate) VALUES (34, 534, CURRENT_DATE);
INSERT INTO log_table VALUES (current_user, now());</code></pre>
<p>При вставке проверяются все ограничения: PK, UNIQUE, NOT NULL, CHECK, FK (вставка в дочернюю таблицу требует существования родителя).</p>
`);

add(62,'Операторы DML. Команда UPDATE. Примеры',`
<p><b>UPDATE</b> изменяет значения столбцов существующих строк.</p>
<pre><code>UPDATE таблица
SET столбец = выражение [, ...]
[ FROM другие_таблицы ]
[ WHERE условие ];</code></pre>
<p>Без WHERE обновляются <b>все</b> строки таблицы! В SET можно использовать выражения и подзапросы.</p>
<pre><code>UPDATE customer SET fax = NULL;                      -- у всех покупателей
UPDATE customer SET address = '134 Rodeo Drive' WHERE id = 87;

UPDATE stock SET unitprice = unitprice * 1.10 WHERE onhand &lt; reorder;

UPDATE orders
SET customerid = (SELECT id FROM customer
                  WHERE lastname = 'King' AND firstname = 'Martin')
WHERE id = 562;

UPDATE student SET studentship = 3000 WHERE n_z = '170120'
RETURNING n_z, studentship;</code></pre>
<p>Обновление строк родительской таблицы, на которые ссылаются дочерние, подчиняется стратегии ссылочной целостности (RESTRICT, CASCADE и т.д.).</p>
`);

add(63,'Операторы DML. Команда DELETE. Примеры',`
<p><b>DELETE</b> удаляет строки из таблицы.</p>
<pre><code>DELETE FROM таблица [ WHERE условие ] [ RETURNING ... ];</code></pre>
<p>Без WHERE удаляются <b>все</b> строки таблицы. Чтобы удалить конкретные строки, используйте WHERE.</p>
<pre><code>DELETE FROM orderhistory;                       -- всё содержимое
DELETE FROM item WHERE orderid = 739;
DELETE FROM student WHERE n_z = '190199';

-- с подзапросом: покупатели без заказов
DELETE FROM customer
WHERE id NOT IN (SELECT customerid FROM orders);

-- быстрая очистка (DDL)
TRUNCATE TABLE orderhistory;</code></pre>
<p>Удаление строки родительской таблицы, на которую ссылаются дочерние, зависит от стратегии: RESTRICT (запрещено), CASCADE (удалятся дочерние), SET NULL/DEFAULT. В справочниках удалять не рекомендуется. Отличие от TRUNCATE: DELETE работает построчно, использует WHERE и триггеры; TRUNCATE быстрее и не принимает условий.</p>
`);

add(64,'Операторы DTL. Примеры',`
<p>Команды управления транзакциями (<b>DTL / TCL</b>) определяют исход транзакции.</p>
<ul>
<li><code>BEGIN</code> (<code>START TRANSACTION</code>) — явное начало транзакции. В Oracle начало неявное.</li>
<li><code>COMMIT</code> — фиксирует все изменения (делает их постоянными), снимает блокировки и неявно начинает новую транзакцию.</li>
<li><code>ROLLBACK</code> — отменяет изменения текущей транзакции и снимает блокировки.</li>
<li><code>SAVEPOINT имя</code> — промежуточная точка сохранения. <code>ROLLBACK TO SAVEPOINT имя</code> отменяет изменения только после этой точки; транзакция остаётся активной.</li>
</ul>
<pre><code>BEGIN;
INSERT INTO orders (id, customerid, orderdate) VALUES (300, 7, CURRENT_DATE);
SAVEPOINT one;
UPDATE stock SET onhand = onhand - 5 WHERE id = 1;
SAVEPOINT two;
DELETE FROM item WHERE orderid = 300;
ROLLBACK TO SAVEPOINT two;     -- отменён только DELETE
ROLLBACK TO SAVEPOINT one;     -- отменён и UPDATE
COMMIT;                        -- зафиксирован только INSERT</code></pre>
<p>Если после точки <code>two</code> есть более ранняя <code>one</code>, откат к <code>one</code> удаляет все точки, созданные после неё. Команды DDL в PostgreSQL тоже транзакционны, в Oracle выполняют неявный COMMIT.</p>
`);

add(65,'Определение параметров транзакции',`
<p>Параметры транзакции задаёт команда:</p>
<pre><code>SET TRANSACTION [ ISOLATION LEVEL уровень ] [ READ WRITE | READ ONLY ] [ [NOT] DEFERRABLE ];
BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY;   -- то же при старте</code></pre>
<h4>Режим доступа</h4>
<ul><li><code>READ WRITE</code> (по умолчанию) — разрешены изменения;</li><li><code>READ ONLY</code> — только чтение (согласованный снимок данных).</li></ul>
<h4>Уровни изоляции (стандарт SQL)</h4>
<table>
<tr><th>Уровень</th><th>Грязное чтение</th><th>Неповторяемое чтение</th><th>Фантомы</th></tr>
<tr><td>READ UNCOMMITTED</td><td>возможно (в PostgreSQL ведёт себя как READ COMMITTED)</td><td>да</td><td>да</td></tr>
<tr><td>READ COMMITTED (по умолчанию в PostgreSQL)</td><td>нет</td><td>да</td><td>да</td></tr>
<tr><td>REPEATABLE READ</td><td>нет</td><td>нет</td><td>в PostgreSQL нет</td></tr>
<tr><td>SERIALIZABLE</td><td>нет</td><td>нет</td><td>нет</td></tr>
</table>
<p>Чем выше уровень, тем лучше согласованность и тем больше накладные расходы и вероятность конфликтов. Параметры нужно задать <b>до первой команды</b> транзакции.</p>
<pre><code>BEGIN;
SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;
SELECT SUM(total) FROM orders;
COMMIT;</code></pre>
`);

add(66,'Команды DСL. Привилегии. Примеры',`
<p>Команды управления данными (DCL) позволяют управлять доступом пользователей к БД и использованием конкретных объектов. Операторы DCL включают <b>GRANT</b>, <b>REVOKE</b> и <b>SET ROLE</b>.</p>
<h4>Привилегии</h4>
<ul>
<li><b>Системные</b> (право на действия определённого типа): <code>CREATE TABLE</code>, <code>CREATE VIEW</code>, <code>CREATE USER</code>, <code>CREATE ROLE</code>, <code>CREATE TRIGGER</code>.</li>
<li><b>Объектные</b> (на конкретный объект): <code>SELECT</code>, <code>INSERT</code>, <code>UPDATE</code>, <code>DELETE</code>, <code>REFERENCES</code>, <code>TRUNCATE</code>, <code>TRIGGER</code>, <code>EXECUTE</code> (для функций), <code>USAGE</code> (для схем), <code>CONNECT</code> (для БД). Ключевое слово <code>ALL</code> — все привилегии.</li>
</ul>
<pre><code>GRANT SELECT ON customer TO jefferson;           -- чтение таблицы
GRANT SELECT, INSERT, UPDATE, DELETE ON customer TO jkennedy;
GRANT ALL ON customer TO tjefferson;
GRANT UPDATE (shipdate) ON orders TO clerk;      -- на столбец</code></pre>
<p>Привилегии можно передавать другим: <code>WITH GRANT OPTION</code> (объектные) и <code>WITH ADMIN OPTION</code> (системные и роли).</p>
`);

add(67,'Команды DСL. Команда GRANT. Формальное описание. Примеры',`
<h4>Формальное описание (PostgreSQL, упрощённо)</h4>
<pre><code>GRANT { привилегия [, ...] | ALL [PRIVILEGES] }
  ON { [TABLE] таблица [, ...] | ALL TABLES IN SCHEMA схема | SEQUENCE ... | FUNCTION ... | SCHEMA ... | DATABASE ... }
  TO { пользователь | роль | PUBLIC } [, ...]
  [ WITH GRANT OPTION ];

GRANT роль [, ...] TO пользователь [, ...] [ WITH ADMIN OPTION ];</code></pre>
<ul>
<li>после <code>ON</code> указывается объект, после <code>TO</code> — кому предоставляется;</li>
<li><code>PUBLIC</code> — всем пользователям;</li>
<li><code>WITH GRANT OPTION</code> позволяет получателю передавать полномочие дальше.</li>
</ul>
<h4>Примеры (из лекций)</h4>
<pre><code>GRANT CREATE TABLE, CREATE VIEW TO gwashington, alincoln;   -- системные (Oracle)
GRANT placeorders, updateorders, deleteorderentry TO tjefferson;  -- роли
GRANT SELECT ON customer TO tjefferson;
GRANT ALL ON customer TO tjefferson;
GRANT SELECT, INSERT, UPDATE, DELETE ON customer
  TO jkennedy WITH GRANT OPTION;
GRANT CREATE TABLE TO rreagan WITH ADMIN OPTION;           -- Oracle</code></pre>
<p>Первый оператор даёт пользователям GWASHINGTON и ALINCOLN системные полномочия CREATE TABLE и CREATE VIEW; второй — предоставляет пользователю роли; третий — полномочие SELECT на таблицу CUSTOMER.</p>
`);

add(68,'Команды DСL. Роли. Примеры',`
<p><b>Роль</b> — именованный набор привилегий (и других ролей), который можно предоставлять пользователям. Это упрощает администрирование: при изменении обязанностей меняют роль, а не права каждого пользователя.</p>
<pre><code>CREATE ROLE placeorders;
GRANT SELECT, INSERT ON orders, item TO placeorders;
GRANT SELECT ON customer, stock TO placeorders;
